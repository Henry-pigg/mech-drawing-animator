<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>机械制图过程演示 · 画法几何</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">▱</span>
      <div>
        <h1>机械制图过程演示</h1>
        <p class="sub">点线面投影 · 三视图 · 截交相贯 · 组合体 · 轴测图 · 几何作图</p>
      </div>
    </div>
    <button id="btn-settings" class="btn-secondary">⚙ API 设置</button>
  </header>

  <main>
    <aside class="sidebar">
      <div class="panel">
        <h3>上传题目照片</h3>
        <input type="file" id="file-input" accept="image/*" hidden>
        <button id="btn-upload" class="btn-primary">📷 拍照 / 上传题目</button>
        <p class="hint">AI 识别题型与尺寸，自动生成作图步骤</p>
      </div>

      <div class="panel grow">
        <h3>题型库</h3>
        <div id="template-list" class="template-list"></div>
      </div>

      <div class="panel last">
        <h3>当前题目</h3>
        <div id="current-part-name" class="current-name">—</div>
      </div>
    </aside>

    <section class="canvas-area">
      <canvas id="canvas"></canvas>
      <div id="variant-bar" class="variant-bar hidden"></div>
      <div id="overlay-loading" class="overlay hidden">
        <div class="spinner"></div>
        <p>AI 正在识图...</p>
      </div>
    </section>

    <aside class="sidebar right">
      <div class="panel">
        <h3>作图步骤</h3>
        <div id="step-list" class="step-list"></div>
      </div>
      <div class="panel grow">
        <h3>本步讲解</h3>
        <div id="step-title" class="step-title">—</div>
        <div id="step-desc" class="step-desc">选择一个题型开始</div>
      </div>
    </aside>
  </main>

  <footer>
    <button id="btn-prev" class="btn-control" disabled>⏮ 上一步</button>
    <button id="btn-play" class="btn-control btn-primary" disabled>▶ 播放</button>
    <button id="btn-next" class="btn-control" disabled>下一步 ⏭</button>
    <div class="speed-control">
      <label>速度</label>
      <select id="speed-select">
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="2">2x</option>
        <option value="3">3x</option>
      </select>
    </div>
    <div class="step-progress"><span id="step-current">0</span> / <span id="step-total">0</span></div>
  </footer>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <h2>API 设置</h2>
      <p class="hint">API Key 只保存在浏览器本地，不会上传到任何服务器。</p>
      <label>API Base URL</label>
      <input type="text" id="cfg-baseurl" placeholder="https://api.openai.com/v1" value="https://api.openai.com/v1">
      <label>API Key</label>
      <input type="password" id="cfg-apikey" placeholder="sk-...">
      <label>模型名称（需支持图片输入）</label>
      <input type="text" id="cfg-model" placeholder="gpt-4o" value="gpt-4o">
      <div class="modal-actions">
        <button id="btn-cancel-settings" class="btn-secondary dark">取消</button>
        <button id="btn-save-settings" class="btn-primary">保存</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/paper.js"></script>
  <script src="js/geom3d.js"></script>
  <script src="js/views.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/templates2d.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/player.js"></script>
  <script src="js/llm.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
