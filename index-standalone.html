/* Player — 按步回放（动画由 SVG/CSS 驱动，这里只管节奏与状态） */
class Player {
  constructor(render, ui) {
    this.render = render
    this.ui = ui
    this.scene = null
    this.steps = []
    this.index = 0
    this.playing = false
    this.speed = 1
    this._timer = null
    this.ui.btnPrev.onclick = () => this.prev()
    this.ui.btnNext.onclick = () => this.next()
    this.ui.btnPlay.onclick = () => this.toggle()
    this.ui.btnReset.onclick = () => this.goTo(0)
    this.ui.speedSelect.onchange = e => { this.speed = parseFloat(e.target.value) }
  }

  load(scene) {
    this.scene = scene
    this.steps = scene.steps
    this.index = 0
    this.playing = false
    clearTimeout(this._timer)
    this.render.setScene(scene)
    this.render.showStep(0)
    this.renderSteps()
    this.update()
  }

  renderSteps() {
    const box = this.ui.stepList
    box.innerHTML = ''
    this.steps.forEach((s, i) => {
      const b = document.createElement('button')
      b.className = 'step'
      b.innerHTML = `<span class="n">${i + 1}</span><span class="t">${escapeHtml(s.title)}</span>`
      b.onclick = () => this.goTo(i)
      box.appendChild(b)
    })
  }

  update() {
    const s = this.steps[this.index]
    this.ui.stepCurrent.textContent = this.index + 1
    this.ui.stepTotal.textContent = this.steps.length
    this.ui.stepTitle.textContent = s ? s.title : ''
    this.ui.stepDesc.innerHTML = s ? richText(s.desc || '') : ''
    this.ui.btnPrev.disabled = this.index <= 0
    this.ui.btnNext.disabled = this.index >= this.steps.length - 1
    this.ui.btnPlay.disabled = !this.steps.length
    this.ui.btnPlay.textContent = this.playing ? '⏸ 暂停' : (this.index >= this.steps.length - 1 ? '↻ 重播' : '▶ 播放')
    ;[...this.ui.stepList.children].forEach((el, i) => {
      el.classList.toggle('cur', i === this.index)
      el.classList.toggle('done', i < this.index)
    })
    const cur = this.ui.stepList.children[this.index]
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest' })
  }

  goTo(i) {
    this.playing = false
    clearTimeout(this._timer)
    this.index = Math.max(0, Math.min(this.steps.length - 1, i))
    this.render.showStep(this.index)
    this.update()
  }

  next() {
    if (this.index < this.steps.length - 1) {
      this.playing = false
      clearTimeout(this._timer)
      this.index++
      this.render.showStep(this.index)
      this.update()
    }
  }

  prev() {
    if (this.index > 0) {
      this.playing = false
      clearTimeout(this._timer)
      this.index--
      this.render.showStep(this.index)
      this.update()
    }
  }

  toggle() {
    if (this.playing) { this.playing = false; clearTimeout(this._timer); this.update(); return }
    if (this.index >= this.steps.length - 1) {
      this.index = 0
      this.render.showStep(0)
    }
    this.playing = true
    this.update()
    this._advance()
  }

  _advance() {
    const dur = 900 / this.speed + 520
    this._timer = setTimeout(() => {
      if (!this.playing) return
      if (this.index < this.steps.length - 1) {
        this.index++
        this.render.showStep(this.index)
        this.update()
        this._advance()
      } else {
        this.playing = false
        this.update()
      }
    }, dur)
  }
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
}
function richText(t) {
  return escapeHtml(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
}

/* LLM — 图纸识别：照片 → DrawingDoc JSON */
class Recognizer {
  constructor(cfg) { this.cfg = cfg }

  async recognize(file, onIssue) {
    if (!AppConfig.hasApiKey) throw new Error('请先在设置中填入 API Key')
    const dataUrl = await this._prepare(file)
    let lastErr = null
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const raw = await this._call(dataUrl, attempt > 0)
        const { doc, issues } = DrawingDoc.normalize(raw, { width: 920, height: 660 })
        if (onIssue) onIssue(issues)
        if (!doc) throw new Error(issues.find(i => i.level === 'error')?.msg || '模型输出无法解析')
        return { doc, issues, raw }
      } catch (e) {
        lastErr = e
        if (!/无法解析|不是合法 JSON|格式/.test(e.message)) throw e
      }
    }
    throw lastErr
  }

  /* 手机照片动辄 4000px、好几 MB，直接塞给接口容易超时或被拒（413/400）。
     先等比压到长边 1600px、JPEG 0.85 —— 识图够用，体积能小一个数量级。 */
  async _prepare(file) {
    const raw = await this._toDataUrl(file)
    try {
      const shrunk = await this._shrink(raw, 1600, 0.85)
      /* 压完反而更大（小图重编码会变大）就退回原图 */
      return shrunk.length < raw.length ? shrunk : raw
    } catch {
      return raw
    }
  }

  _shrink(dataUrl, maxSide, quality) {
    return new Promise((resolve, reject) => {
      const img = new Image()
      img.onload = () => {
        const { naturalWidth: w, naturalHeight: h } = img
        if (!w || !h) { reject(new Error('图片尺寸异常')); return }
        const k = Math.min(1, maxSide / Math.max(w, h))
        if (k >= 1 && dataUrl.length < 900 * 1024) { resolve(dataUrl); return }
        const cw = Math.round(w * k), ch = Math.round(h * k)
        const cv = document.createElement('canvas')
        cv.width = cw; cv.height = ch
        const ctx = cv.getContext('2d')
        // JPEG 没有透明通道，先铺白底，免得透明 PNG 压出来是黑底
        ctx.fillStyle = '#fff'
        ctx.fillRect(0, 0, cw, ch)
        ctx.drawImage(img, 0, 0, cw, ch)
        resolve(cv.toDataURL('image/jpeg', quality))
      }
      img.onerror = () => reject(new Error('图片解码失败'))
      img.src = dataUrl
    })
  }

  async _call(dataUrl, repair) {
    const body = {
      model: this.cfg.model,
      temperature: 0.1,
      max_tokens: 4000,
      messages: [
        { role: 'system', content: Recognizer.PROMPT },
        {
          role: 'user',
          content: [
            { type: 'image_url', image_url: { url: dataUrl } },
            { type: 'text', text: repair ? '上一次输出不是合法 JSON。请只输出一个 JSON 对象，不要围栏、不要解释。' : '识别这张工程制图题目，拆成可回放的绘图步骤，只输出 JSON。' },
          ],
        },
      ],
    }
    const res = await fetch(`${this.cfg.baseUrl.replace(/\/$/, '')}/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${this.cfg.apiKey}` },
      body: JSON.stringify(body),
      signal: this._sig ? this._sig() : undefined,
    })
    if (res.status === 413) throw new Error('413 图片太大，接口拒绝接收')
    if (!res.ok) throw new Error(`接口返回 ${res.status}：${(await res.text()).slice(0, 200)}`)
    const json = await res.json()
    const content = json.choices?.[0]?.message?.content
    if (!content) throw new Error('接口未返回内容')
    return typeof content === 'string' ? content : JSON.stringify(content)
  }

  /* 120 秒硬超时：不设的话，网络卡住时界面会永远停在"正在识图…" */
  _sig() {
    if (this._ac) this._ac.abort()
    this._ac = new AbortController()
    this._timer = setTimeout(() => this._ac && this._ac.abort(), 120000)
    return this._ac.signal
  }

  _toDataUrl(file) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader()
      fr.onload = () => resolve(fr.result)
      fr.onerror = () => reject(new Error('图片读取失败'))
      fr.readAsDataURL(file)
    })
  }
}

Recognizer.PROMPT = `你是《机械制图 / 画法几何》助教。把用户上传的题目图片，转成一份"可逐步播放的绘图指令"JSON。

你不是在画一幅图，而是在拆解画图的过程：先定基准，再画已知线段，最后画连接线并标注尺寸。

【输出铁律】
1. 只输出一个 JSON 对象，不要 markdown 围栏，不要任何解释文字。
2. 严格用下方字段，不增字段名、不加层级。
3. 看不清的宁可不画，并写进 warnings。
4. 不要输出 SVG、path 字符串、箭头或尺寸界线的坐标——这些由前端算。

【坐标系】
- 画布 920 × 660，原点在左上角，x 向右，y 向下。
- 所有图形落在安全区 x∈[70,850]，y∈[70,590] 内。
- 单位是画布像素，1 位小数即可。不必按 1:1，真实尺寸只体现在 dimension.text 里。
- arc 角度：0° 指向 +x，逆时针为正；但 y 轴向下，取点公式是 (cx + r·cosθ, cy − r·sinθ)。
  即 θ=90° 在正上方，θ=180° 在正左方。endAngle > startAngle 表示逆时针。

【图元白名单】
- line: {kind:"line", id, lineType, x1,y1,x2,y2}
- circle: {kind:"circle", id, lineType, cx,cy,r}
- arc: {kind:"arc", id, lineType, cx,cy,r,startAngle,endAngle}
- dimension: {kind:"dimension", id, from:{x,y}, to:{x,y}, offset, orientation:"aligned"|"horizontal"|"vertical", text}
- text: {kind:"text", id, x, y, text, size(默认18), anchor:"start"|"middle"|"end"}
- point: {kind:"point", id, x, y}   // 小圆点，用于 A、B 等被求的点

lineType：thick 可见轮廓 / dashed 不可见轮廓 / center 轴线·中心线·对称线 / thin 细实线（少用）。
尺寸标注自动按细实线画，不要给 dimension 加 lineType。

【画法几何专项规则】
1. 三视图：主视图左上，俯视图正下方，左视图正右侧。
   - 主视图与俯视图"长对正"：同一特征的 x 完全一致。
   - 主视图与左视图"高平齐"：同一特征的 y 完全一致。
   - 俯视图与左视图"宽相等"：俯视图竖直跨度 = 左视图水平跨度。
   - 每个视图先画中心线（center），再画轮廓（thick），不可见轮廓用 dashed。
   - 建议布局：主视图 x∈[140,420] y∈[110,340]；俯视图 y∈[400,570]；左视图 x∈[500,780]。
2. 表面取点：已知投影用 point + text 标出（如 a′），求出的投影同样标出。
   - 主视图用 a′、俯视图用 a、左视图用 a″；不可见时文字加括号，如 (b″)。
   - 文字放在点右上方 10~14px。
3. 轴测图：X 轴向右下 30°，Y 轴向左下 30°，Z 轴竖直向上。
4. 圆弧连接：先画已知圆弧（circle/arc），再画连接弧；切点按"外切 r+R、内切 |R−r|"定圆心。
5. 尺寸只标题目给出的或关键的 3~6 个，不要凑数。

【步骤拆分方法论】
按真实作图顺序，每步只做一件事：
1) 基准（中心线、轴线）→ 2) 已知线段 → 3) 中间线段 → 4) 连接线段 → 5) 尺寸（集中最后一步）
- 步骤数 3~10，每步 1~6 个图元。
- title ≤ 12 字，动宾结构，如"画俯视图五边形""求 a″ 的投影"。
- narration ≤ 60 字，讲清依据或易错点，不要复述 title。

【输出格式】
{"version":"1.0","meta":{"title":"零件/题目名称","standard":"GB/T 4457.4","unit":"mm","width":920,"height":660,"summary":"一句话说明你看懂了什么，≤40字","confidence":0.9},"warnings":[],"steps":[{"id":"s1","title":"画中心线","narration":"先定圆心与轴线，后面所有尺寸都从这里量起。","primitives":[{"id":"s1-e1","kind":"line","lineType":"center","x1":180,"y1":300,"x2":620,"y2":300}]}]}

【自检】
- 只有一个 JSON？id 全局唯一？坐标都在安全区？
- arc 的角度换算是否遵守 y 轴向下？
- 尺寸是否都在最后一步、都带 text？
- 三视图是否满足长对正、高平齐？

现在开始，只输出 JSON。`

  async function handleFile(file) {
    /* 选文件的 input 有个坑：不清空 value 的话，再次选同一张图不会触发 change，

    const reset = () => { try { fileInput.value = '' } catch { } }

    if (!file.type || !file.type.startsWith('image/')) {
      reset(); toast('请上传图片文件', 'err'); return
    }
    if (!AppConfig.hasApiKey) {
      reset()
      openSettings()
      toast('先填 API Key，再上传题目', 'err')
      return

    status.className = 'ai-status loading'
    status.textContent = '正在识图…'
    $('ai-result').classList.add('hide')
    const t0 = performance.now()
    try {
      const rec = new Recognizer({ baseUrl: AppConfig.baseUrl, apiKey: AppConfig.apiKey, model: AppConfig.model })
      const { doc, issues } = await rec.recognize(file)
      const scene = DrawingDoc.toScene(doc)
      currentScene = scene
      player.load(scene)
      setMode('doc')
      $('doc-title').textContent = doc.meta.title
      renderVariants(null)
      document.querySelectorAll('.item').forEach(b => b.classList.remove('on'))
      showAiResult(doc, issues, Math.round(performance.now() - t0))
      status.className = 'ai-status ok'
      status.textContent = `识别完成 · ${doc.steps.length} 步`
    } catch (err) {
      status.className = 'ai-status err'
      status.textContent = '识别失败'
      showAiError(err)
    } finally {
      reset()
    }
  }

  function showAiResult(doc, issues, ms) {
    const card = $('ai-result')
    card.classList.remove('hide')
    const conf = doc.meta.confidence
    const level = conf == null ? '' : conf >= 0.85 ? 'high' : conf >= 0.65 ? 'mid' : 'low'
    card.innerHTML = `
      <div class="ai-summary">${escapeHtml(doc.meta.summary || '（模型未给出摘要）')}</div>
      <div class="ai-meta">
        ${conf == null ? '' : `<span class="conf ${level}">置信度 ${(conf * 100).toFixed(0)}%</span>`}
        <span class="muted">${ms} ms</span>
      </div>
      ${doc.warnings.length ? `<ul class="warns">${doc.warnings.map(w => `<li>${escapeHtml(w)}</li>`).join('')}</ul>` : ''}
      ${issues && issues.length ? `<details class="issues"><summary>${issues.length} 条自动修复</summary><ul>${issues.map(i => `<li>${escapeHtml(i.msg)}</li>`).join('')}</ul></details>` : ''}
    `
  }

  /* 把各种失败翻译成用户能照着做的提示 */
  function explainError(err) {
    const msg = String((err && err.message) || err || '未知错误')
    const name = (err && err.name) || ''
    const isFile = location.protocol === 'file:'
    if (name === 'AbortError' || /aborted|timeout|timed out|超时/i.test(msg)) {
      return {
        title: '请求超时（等了 2 分钟）',
        hints: ['图片可能太大或网络太慢 —— 现在已经会自动压缩到长边 1600px，若仍超时就换张清晰但小一点的图。', '也可能是接口地址填错、或该服务此刻不通。'],
        raw: msg,
      }
    }
    if (/413|图片太大/i.test(msg)) {
      return { title: '图片太大被接口拒绝（413）', hints: ['把照片裁到只保留题目部分，或降低分辨率再上传。'], raw: msg }
    }
    if (/Failed to fetch|NetworkError|ERR_FAILED|Load failed/i.test(msg)) {
      return {
        title: '网络请求被拦住',
        hints: [
          isFile
            ? '你现在是直接双击打开 HTML（file:// 协议）。部分浏览器会拦掉这种页面的跨域请求 —— 这是最常见的原因。'
            : '请求没能到达接口，可能是网络不通、接口地址写错，或对方不允许浏览器直接调用。',
          isFile ? '解决办法：用本地服务器打开，或改用下方"单文件版 + 支持 CORS 的接口"。' : '先确认 API Base URL 是否正确（OpenAI 官方是 https://api.openai.com/v1）。',
          '很多中转/代理接口默认不允许浏览器跨域调用，需要服务端放行 CORS，或改走本地代理。',
        ],
        raw: msg,
      }
    }
    if (/401|403|Unauthorized|invalid.*key|Incorrect API key/i.test(msg)) {
      return { title: 'API Key 无效或没有权限', hints: ['到设置里重新粘贴 Key，注意不要带空格或换行。'], raw: msg }
    }
    if (/404/.test(msg)) {
      return { title: '接口地址或模型名不对（404）', hints: ['检查 Base URL 末尾是否多了 /v1/v1，以及模型名是否被该服务支持。'], raw: msg }
    }
    if (/429|quota|rate limit/i.test(msg)) {
      return { title: '额度不足或被限流（429）', hints: ['稍后再试，或换一个 Key / 模型。'], raw: msg }
    }
    if (/timeout|timed out|ETIMEDOUT/i.test(msg)) {
      return { title: '请求超时', hints: ['图片可能太大，或网络太慢。可以换一张小一点的图再试。'], raw: msg }
    }
    if (/无法解析|无法从返回|解析出 JSON|不是合法 JSON|steps 缺失|没有任何可渲染|output|看不清/i.test(msg)) {
      return {
        title: '模型返回的内容没法当成图纸',
        hints: [
          '它可能没看懂图，或没按要求输出 JSON。换一个指令跟随更强的视觉模型（gpt-4o / qwen-vl-max / glm-4v）通常能解决。',
          '也可以把题目裁得更清楚一点再传。',
        ],
        raw: msg,
      }
    }
    return { title: '识别失败', hints: ['可以换一张更清晰的图，或在设置里换一个支持图片输入的模型。'], raw: msg }
  }

  function showAiError(err) {
    const card = $('ai-result')
    const info = explainError(err)
    card.classList.remove('hide')
    card.innerHTML = `<div class="ai-error"><b>${escapeHtml(info.title)}</b></div>
      <ul class="err-hints">${info.hints.map(h => `<li>${escapeHtml(h)}</li>`).join('')}</ul>
      <details class="issues"><summary>原始错误</summary><div class="raw">${escapeHtml(info.raw)}</div></details>`
  }

  /* ---------- 设置 ---------- */
  const modal = $('settings-modal')

  /* 直接双击 HTML 打开（file://）时，部分浏览器会把跨域请求拦成 "Failed to fetch"，
     这是"能选图但永远识别失败"最常见的原因，所以在设置里直接说清楚。 */
  function refreshNetWarn() {
    const box = $('net-warn')
    if (location.protocol !== 'file:') { box.classList.add('hide'); return }
    box.classList.remove('hide')
    box.innerHTML = `<b>当前是以 file:// 打开的</b><br>
      浏览器可能拦截对本接口的请求，症状就是选图后一直"识别失败 / Failed to fetch"。
      在项目目录下起一个本地服务器再访问即可：<br>
      <code>python -m http.server 8000</code><br>
      然后打开 <code>http://localhost:8000/index.html</code>`
  }

  function openSettings() {
    const cfg = AppConfig.get()
    $('cfg-baseurl').value = cfg.baseUrl || 'https://api.openai.com/v1'
    $('cfg-apikey').value = cfg.apiKey || ''
    $('cfg-model').value = cfg.model || 'gpt-4o'
    refreshNetWarn()
    modal.classList.remove('hide')
  }

  /* 连通性测试：先打 /models（不耗额度），失败再解释原因 */
  async function testConn() {
    const out = $('test-out')
    const cfg = {
      baseUrl: $('cfg-baseurl').value.trim() || 'https://api.openai.com/v1',
      apiKey: $('cfg-apikey').value.trim(),
      model: $('cfg-model').value.trim() || 'gpt-4o',
    }
    if (!cfg.apiKey) { out.className = 'test-out err'; out.textContent = '先填 API Key'; return }
    out.className = 'test-out wait'
    out.textContent = '正在连接…'
    const t0 = performance.now()
    try {
      const res = await fetch(`${cfg.baseUrl.replace(/\/$/, '')}/models`, {
        headers: { Authorization: `Bearer ${cfg.apiKey}` },
      })
      const ms = Math.round(performance.now() - t0)
      if (res.ok) {
        let names = []
        try { const j = await res.json(); names = (j.data || []).map(m => m.id).slice(0, 40) } catch { }
        const hit = names.length && !names.includes(cfg.model)
        out.className = 'test-out ok'
        out.textContent = `通了（${ms} ms）` + (hit ? `，但列表里没有 ${cfg.model}，确认下模型名` : '')
      } else {
        out.className = 'test-out err'
        out.textContent = `接口返回 ${res.status}：${(await res.text()).slice(0, 120)}`
      }
    } catch (e) {
      out.className = 'test-out err'
      out.textContent = explainError(e).title + '（详见识别失败时的提示）'
    }
  }

  $('btn-test').onclick = testConn
  $('btn-settings').onclick = openSettings
  $('btn-cancel-settings').onclick = () => modal.classList.add('hide')
  $('btn-save-settings').onclick = () => {
    AppConfig.save({
      baseUrl: $('cfg-baseurl').value.trim(),
      apiKey: $('cfg-apikey').value.trim(),
      model: $('cfg-model').value.trim(),
    })
    modal.classList.add('hide')
    toast('已保存', 'ok')
  }

  /* ---------- 导出 ---------- */
  $('btn-svg').onclick = () => render.exportSvg(currentScene ? currentScene.title : 'drawing')
  $('btn-png').onclick = () => render.exportPng(currentScene ? currentScene.title : 'drawing', 2)

  /* ---------- 键盘 ---------- */
  document.addEventListener('keydown', e => {
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return
    if (e.key === 'ArrowRight') { e.preventDefault(); player.next() }
    if (e.key === 'ArrowLeft') { e.preventDefault(); player.prev() }
    if (e.key === ' ') { e.preventDefault(); player.toggle() }
  })

  function toast(msg, kind) {
    const t = $('toast')
    t.textContent = msg
    t.className = 'toast show ' + (kind || '')
    clearTimeout(t._t)
    t._t = setTimeout(() => { t.className = 'toast' }, 2400)
  }

  // 默认示例
  loadTemplate('prism3', { sides: 5 })
  $('build-tag').textContent = AppConfig.BUILD
  if (!AppConfig.hasApiKey) {
    status.textContent = '未配置识别接口 · 可先用下方题库'
    status.className = 'ai-status'
  }
})
  </script>

</body>
</html>
