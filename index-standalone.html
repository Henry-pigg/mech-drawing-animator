<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>机械制图 · 分步绘制</title>
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ink: #121820;
  --ink-2: #46525f;
  --muted: #7b8794;
  --line: #e4e9ef;
  --line-2: #d3dae2;
  --bg: #f3f5f8;
  --paper: #ffffff;
  --blue: #2f5d9e;
  --blue-d: #244a80;
  --accent: #c0392b;
  --ok: #2e8b57;
  --warn: #c9821a;
}

html, body { height: 100%; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 13.5px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---------- 顶栏 ---------- */
.bar {
  height: 56px;
  flex-shrink: 0;
  background: #fff;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
}
.brand { display: flex; align-items: center; gap: 11px; }
.mark {
  width: 34px; height: 34px; border-radius: 9px;
  background: linear-gradient(135deg, #2f5d9e, #1c3f6e);
  color: #fff; display: flex; align-items: center; justify-content: center;
}
.brand-txt h1 { font-size: 15px; font-weight: 650; letter-spacing: .2px; }
.brand-txt p { font-size: 11px; color: var(--muted); margin-top: 2px; }
.bar-right { display: flex; align-items: center; gap: 8px; }
.tag {
  font-size: 11.5px; color: var(--ink-2); background: #eef2f7;
  border: 1px solid #e2e8ef; border-radius: 999px; padding: 3px 10px;
}
.tag.is-doc { color: #1c5c96; background: #e8f2fc; border-color: #cfe3f7; }
/* 版本水印：旧版页面没有这一项，一眼可辨 */
.build-tag {
  font-size: 10.5px; color: #9aa6b4; border-left: 1px solid var(--line);
  padding-left: 9px; margin-left: 2px; letter-spacing: .2px;
  font-variant-numeric: tabular-nums; user-select: none;
}

/* ---------- 按钮 ---------- */
.btn {
  border: 1px solid var(--line-2); background: #fff; color: var(--ink);
  padding: 7px 12px; border-radius: 7px; font-size: 12.5px; cursor: pointer;
  transition: background .14s, border-color .14s, color .14s;
  white-space: nowrap;
}
.btn:hover { background: #f6f8fb; border-color: #c3ccd6; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.primary:hover { background: var(--blue-d); border-color: var(--blue-d); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: #eef2f7; }

/* ---------- 布局 ---------- */
.layout {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr) 236px;
  gap: 0;
}
.side {
  background: #fff; border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 0; overflow: hidden;
}
.side .card { padding: 13px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 9px; }
.side .card.grow { flex: 1; min-height: 0; border-bottom: none; }
.card h2, .rail h2 {
  font-size: 11px; letter-spacing: 1.1px; text-transform: uppercase;
  color: var(--muted); font-weight: 650;
}

/* 上传区 */
.drop {
  border: 1.5px dashed #cfd9e3; border-radius: 10px;
  padding: 18px 12px; text-align: center; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  color: var(--ink-2); background: #fbfcfe;
  transition: border-color .15s, background .15s;
}
.drop:hover, .drop.over { border-color: var(--blue); background: #f4f8fd; color: var(--blue-d); }
.drop:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.drop.over { border-style: solid; box-shadow: inset 0 0 0 3px #e3eefb; }
.drop strong { font-size: 13px; }
.drop span { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.drop svg { color: #8fa4bb; }

.ai-status { font-size: 12px; color: var(--muted); min-height: 16px; }
.ai-status.loading { color: var(--blue); }
.ai-status.ok { color: var(--ok); }
.ai-status.err { color: var(--accent); }

.ai-result {
  border: 1px solid var(--line); border-radius: 9px; padding: 10px;
  display: flex; flex-direction: column; gap: 7px; background: #fafbfd;
}
.ai-result.hide { display: none; }
.ai-summary { font-size: 12.5px; line-height: 1.6; color: var(--ink-2); }
.ai-meta { display: flex; align-items: center; gap: 8px; font-size: 11.5px; }
.conf { padding: 2px 7px; border-radius: 999px; background: #eef2f7; color: var(--ink-2); }
.conf.high { background: #e6f5ec; color: #24734a; }
.conf.mid { background: #fdf3e3; color: #97651a; }
.conf.low { background: #fdecea; color: #a33; }
.muted { color: var(--muted); }
.warns { margin: 0; padding-left: 16px; font-size: 11.5px; color: var(--warn); line-height: 1.7; }
.issues { font-size: 11.5px; color: var(--muted); }
.issues summary { cursor: pointer; }
.issues ul { margin: 4px 0 0; padding-left: 16px; line-height: 1.7; }
.ai-error { color: var(--accent); font-size: 12.5px; line-height: 1.6; }
.err-hints { margin: 0; padding-left: 17px; font-size: 11.5px; color: var(--ink-2); line-height: 1.75; }
.err-hints li { margin-bottom: 3px; }
.raw {
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  font-size: 10.5px; color: #7b8794; margin-top: 4px;
  word-break: break-all; line-height: 1.55;
}
.hint { font-size: 11.5px; color: var(--muted); line-height: 1.6; margin-top: 4px; }

/* 题库 */
.search {
  width: 100%; border: 1px solid var(--line-2); border-radius: 7px;
  padding: 7px 10px; font-size: 12.5px; outline: none; background: #fbfcfe;
}
.search:focus { border-color: var(--blue); background: #fff; }
.lib-cats { overflow-y: auto; flex: 1; min-height: 0; margin: -2px -4px 0; padding: 0 4px; }
.cat { margin-bottom: 10px; }
.cat-h {
  font-size: 10.5px; color: #98a4b1; letter-spacing: .5px;
  padding: 3px 0 5px; border-bottom: 1px dashed #edf1f5; margin-bottom: 4px;
}
.item {
  display: block; width: 100%; text-align: left; background: none; border: none;
  padding: 5.5px 8px; border-radius: 6px; font-size: 12.5px; color: #3c4855;
  cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.item:hover { background: #f3f7fb; color: var(--blue-d); }
.item.on { background: #e9f1fa; color: var(--blue-d); font-weight: 600; }

/* ---------- 图纸区 ---------- */
.stage {
  display: flex; flex-direction: column; min-width: 0; min-height: 0;
  padding: 12px 14px 10px; gap: 10px;
}
.paper-wrap {
  flex: 1; min-height: 0; position: relative;
  background: #e9edf2;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  padding: 14px;
  box-shadow: inset 0 1px 3px rgba(20, 30, 45, .06);
}
.paper {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
}
/* width/height 100% + preserveAspectRatio="xMidYMid meet"：
   SVG 自身永不拉伸，比例不符时只在四周留白。阴影用 drop-shadow，
   跟随实际绘制的纸张轮廓，而不是元素盒子。 */
.paper svg.dw {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 2px;
  filter: drop-shadow(0 6px 18px rgba(20, 30, 45, .15)) drop-shadow(0 1px 2px rgba(20, 30, 45, .07));
}
.variant-bar {
  position: absolute; left: 22px; top: 20px;
  display: flex; gap: 6px; flex-wrap: wrap; max-width: 72%;
}
.variant-bar.hide { display: none; }
.chip {
  background: rgba(255,255,255,.95); border: 1px solid #d5dde6; color: var(--ink-2);
  padding: 4px 10px; border-radius: 999px; font-size: 11.5px; cursor: pointer;
  backdrop-filter: blur(4px);
}
.chip:hover { border-color: var(--blue); color: var(--blue); }
.chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }

.narration {
  background: #fff; border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 14px; flex-shrink: 0;
}
.narr-head { display: flex; align-items: baseline; gap: 10px; }
.narr-title { font-size: 14px; font-weight: 650; color: var(--blue-d); }
.doc-title { font-size: 11.5px; color: var(--muted); margin-left: auto; }
.narr-body { margin-top: 5px; font-size: 13px; line-height: 1.7; color: var(--ink-2); }
.narr-body b { color: var(--ink); }

.controls {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.speed { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); margin-left: 4px; }
.speed select {
  border: 1px solid var(--line-2); border-radius: 6px; padding: 5px 6px;
  font-size: 12px; color: var(--ink-2); background: #fff;
}
.progress { margin-left: auto; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress b { color: var(--ink); }

/* ---------- 右栏步骤 ---------- */
.rail {
  background: #fff; border-left: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 13px 10px 10px; gap: 9px;
  min-height: 0;
}
.rail h2 { padding-left: 4px; }
.step-list { overflow-y: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 2px; }
.step {
  display: flex; gap: 8px; align-items: flex-start; text-align: left;
  background: none; border: none; padding: 7px 8px; border-radius: 7px;
  font-size: 12.5px; color: #46525f; cursor: pointer; line-height: 1.45;
}
.step:hover { background: #f4f7fa; }
.step .n {
  flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%;
  background: #eef2f7; color: #8b97a3; font-size: 10.5px;
  display: inline-flex; align-items: center; justify-content: center; margin-top: 1px;
}
.step.done { color: #8b97a3; }
.step.done .n { background: #e6f4ec; color: #2e8b57; }
.step.cur { background: #e9f1fa; color: var(--blue-d); font-weight: 600; }
.step.cur .n { background: var(--blue); color: #fff; }

.legend {
  border-top: 1px solid var(--line); padding-top: 8px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 5px 8px; font-size: 10.5px; color: var(--muted);
}
.legend span { display: flex; align-items: center; gap: 5px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2.2px solid #121820; }
.legend i.dashed { border-top-style: dashed; border-top-width: 1.6px; }
.legend i.center { border-top-style: dotted; border-top-width: 1.4px; }
.legend i.dim { border-top: 1.2px solid #2f5d9e; }

/* ---------- 弹窗 / 提示 ---------- */
.modal {
  position: fixed; inset: 0; background: rgba(16, 24, 33, .42);
  display: flex; align-items: center; justify-content: center; z-index: 50;
}
.modal.hide { display: none; }
.modal-box {
  background: #fff; border-radius: 12px; padding: 20px; width: 420px; max-width: 92%;
  box-shadow: 0 20px 60px rgba(10, 18, 28, .28);
}
.modal-box h2 { font-size: 16px; margin-bottom: 4px; }
.modal-box label { display: block; font-size: 11.5px; color: var(--muted); margin: 11px 0 4px; }
.modal-box input {
  width: 100%; border: 1px solid var(--line-2); border-radius: 7px;
  padding: 8px 10px; font-size: 13px; outline: none;
}
.modal-box input:focus { border-color: var(--blue); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

/* file:// 打开时的提醒：跨域请求会被浏览器拦掉 */
.net-warn {
  margin-top: 12px; padding: 9px 11px; border-radius: 8px;
  background: #fdf3e3; border: 1px solid #f0ddba; color: #8a5f14;
  font-size: 11.5px; line-height: 1.7;
}
.net-warn.hide { display: none; }
.net-warn b { color: #6f4a0b; }
.net-warn code {
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  background: rgba(255,255,255,.7); border-radius: 3px; padding: 1px 4px; font-size: 11px;
}
.testbox { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.testbox summary { font-size: 11.5px; color: var(--muted); cursor: pointer; }
.testrow { display: flex; align-items: center; gap: 9px; margin-top: 8px; }
.test-out { font-size: 11.5px; line-height: 1.5; color: var(--ink-2); }
.test-out.ok { color: var(--ok); }
.test-out.err { color: var(--accent); }
.test-out.wait { color: var(--blue); }

.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 10px);
  background: #1d2733; color: #fff; font-size: 12.5px; padding: 8px 14px;
  border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  z-index: 60; max-width: 70%;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: #8d2f28; }
.toast.ok { background: #215c42; }

@media (max-width: 1180px) {
  .layout { grid-template-columns: 260px minmax(0, 1fr) 208px; }
}
@media (max-width: 940px) {
  .layout { grid-template-columns: 240px minmax(0, 1fr); }
  .rail { display: none; }
}
  </style>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M3 20h18M6 20V8l6-4 6 4v12M10 20v-5h4v5"/>
        </svg>
      </span>
      <div class="brand-txt">
        <h1>机械制图 · 分步绘制</h1>
        <p>画法几何 / 三视图 / 截交相贯 / 几何作图</p>
      </div>
    </div>
    <div class="bar-right">
      <span id="mode-tag" class="tag">内置题库</span>
      <button id="btn-svg" class="btn ghost" title="导出矢量图">SVG</button>
      <button id="btn-png" class="btn ghost" title="导出图片">PNG</button>
      <button id="btn-settings" class="btn">⚙ 设置</button>
      <span id="build-tag" class="build-tag" title="当前页面版本。若显示的不是 r4，说明浏览器用了旧缓存，请强制刷新（Ctrl+F5）"></span>
    </div>
  </header>

  <main class="layout">
    <aside class="side">
      <section class="card">
        <h2>识别题目</h2>
        <div id="drop" class="drop" role="button" tabindex="0" aria-label="上传题目照片，或把图片拖进来、直接粘贴">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M12 16V4m0 0L7 9m5-5 5 5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
          </svg>
          <strong>上传题目照片</strong>
          <span>点这里选图 · 也可以拖进来，或直接 Ctrl+V 粘贴</span>
        </div>
        <input type="file" id="file-input" accept="image/*" hidden>
        <div id="ai-status" class="ai-status"></div>
        <div id="ai-result" class="ai-result hide"></div>
      </section>

      <section class="card grow">
        <h2>题型库</h2>
        <input id="lib-search" class="search" placeholder="搜索题型…">
        <div id="lib-cats" class="lib-cats"></div>
      </section>
    </aside>

    <section class="stage">
      <div class="paper-wrap">
        <div id="paper" class="paper"></div>
        <div id="variant-bar" class="variant-bar hide"></div>
      </div>
      <div class="narration">
        <div class="narr-head">
          <span id="step-title" class="narr-title">—</span>
          <span id="doc-title" class="doc-title"></span>
        </div>
        <p id="step-desc" class="narr-body">选择左侧题型，或上传题目照片</p>
      </div>
      <div class="controls">
        <button id="btn-prev" class="btn" disabled>⏮ 上一步</button>
        <button id="btn-play" class="btn primary" disabled>▶ 播放</button>
        <button id="btn-next" class="btn" disabled>下一步 ⏭</button>
        <button id="btn-reset" class="btn ghost" title="回到第一步">↺</button>
        <label class="speed">速度
          <select id="speed-select">
            <option value="0.6">0.6x</option>
            <option value="1" selected>1x</option>
            <option value="1.8">1.8x</option>
            <option value="3">3x</option>
          </select>
        </label>
        <span class="progress"><b id="step-current">0</b> / <span id="step-total">0</span></span>
      </div>
    </section>

    <aside class="rail">
      <h2>绘图步骤</h2>
      <div id="step-list" class="step-list"></div>
      <div class="legend">
        <span><i class="l thick"></i>可见轮廓</span>
        <span><i class="l dashed"></i>不可见</span>
        <span><i class="l center"></i>中心线</span>
        <span><i class="l dim"></i>尺寸</span>
      </div>
    </aside>
  </main>

  <div id="settings-modal" class="modal hide">
    <div class="modal-box">
      <h2>识别模型设置</h2>
      <p class="hint">需要支持图片输入的 OpenAI 兼容接口。Key 只存在浏览器本地。</p>
      <label>API Base URL</label>
      <input id="cfg-baseurl" type="text" placeholder="https://api.openai.com/v1" value="https://api.openai.com/v1">
      <label>API Key</label>
      <input id="cfg-apikey" type="password" placeholder="sk-...">
      <label>模型</label>
      <input id="cfg-model" type="text" placeholder="gpt-4o" value="gpt-4o">
      <div id="net-warn" class="net-warn hide"></div>
      <details class="testbox">
        <summary>连接测试（保存后可点）</summary>
        <div class="testrow">
          <button id="btn-test" class="btn">测试连通</button>
          <span id="test-out" class="test-out"></span>
        </div>
      </details>
      <div class="modal-actions">
        <button id="btn-cancel-settings" class="btn ghost">取消</button>
        <button id="btn-save-settings" class="btn primary">保存</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script>
  // ===== js/config.js =====
const AppConfig = {
  KEY: 'mech_draw_config',
  /* 构建标识：改版时递增，页面上可见，方便确认打开的是哪一版 */
  BUILD: 'r4 · svg',
  get() {
    try { return JSON.parse(localStorage.getItem(this.KEY)) || {} }
    catch { return {} }
  },
  save(cfg) { localStorage.setItem(this.KEY, JSON.stringify(cfg)) },
  get baseUrl() { return this.get().baseUrl || 'https://api.openai.com/v1' },
  get apiKey() { return this.get().apiKey || '' },
  get model() { return this.get().model || 'gpt-4o' },
  get hasApiKey() { return !!this.apiKey }
}

  // ===== js/paper.js =====
/* Paper — 2D 图纸模型
 * 所有模板统一产出 paper 元素（单位 mm，y 轴向上）
 * 元素类型：line / poly / circle / arc / dot / text / arrow
 */
const Paper = (() => {
  const ST = {
    solid:  { w: 0.6,  dash: [] },              // 粗实线：可见轮廓
    thick:  { w: 0.9,  dash: [] },              // 加粗：图形答案
    thin:   { w: 0.15, dash: [] },              // 细实线：作图线/投影线
    hidden: { w: 0.3,  dash: [2.6, 1.3] },      // 细虚线
    center: { w: 0.15, dash: [9, 1.4, 1.4, 1.4] }, // 点划线
  }
  const C = {
    ink:  '#1a1a1a',
    con:  '#9aa3ad',   // 作图辅助线
    pick: '#c0392b',   // 求解结果/强调
    aux:  '#2c6fbb',   // 给定条件
    dim:  '#33404d',
  }
  let _id = 0

  const P = {
    add: (a, b) => [a[0] + b[0], a[1] + b[1]],
    sub: (a, b) => [a[0] - b[0], a[1] - b[1]],
    mul: (a, k) => [a[0] * k, a[1] * k],
    len: a => Math.hypot(a[0], a[1]),
    unit: a => { const l = Math.hypot(a[0], a[1]) || 1; return [a[0] / l, a[1] / l] },
    rot: (a, ang) => [a[0] * Math.cos(ang) - a[1] * Math.sin(ang), a[0] * Math.sin(ang) + a[1] * Math.cos(ang)],
    mid: (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2],
  }

  // ---------- 基础图元 ----------
  function line(a, b, st = 'solid', o = {}) {
    return { t: 'line', a, b, st, id: ++_id, ...o }
  }
  function poly(pts, st = 'solid', closed = false, o = {}) {

    const tri = (tip, toward) => {
      const vx = toward[0] - tip[0], vy = toward[1] - tip[1], L = Math.hypot(vx, vy) || 1

    if (arrow === 'both' || arrow === 'end') els.push(tri(d2, d1))

    faces.push([...Array(n).keys()].reverse())          // 起始端面
    faces.push([...Array(n).keys()].map(i => i + n))    // 终止端面
    for (let i = 0; i < n; i++) { const j = (i + 1) % n; faces.push([i, j, j + n, i + n]) }
    const m = mesh(verts, faces)
    // 端面法向校正
    const want0 = axis === 'y' ? [0, -1, 0] : [0, 0, -1]
    const want1 = mul(want0, -1)
    if (dot(faceNormal(verts, m.faces[0]), want0) < 0) m.faces[0].reverse()
    if (dot(faceNormal(verts, m.faces[1]), want1) < 0) m.faces[1].reverse()
    // 侧面法向校正
    let c = [0, 0, 0]; verts.forEach(v => c = add(c, v)); c = mul(c, 1 / verts.length)
    for (let i = 2; i < m.faces.length; i++) {
      if (dot(faceNormal(verts, m.faces[i]), sub(faceCenter(verts, m.faces[i]), c)) < 0) m.faces[i].reverse()
    }
    return m
  }

  // ---------------- 边 ----------------
  function buildEdges(m, creaseDeg = 14) {
    const map = new Map(), out = []
    for (let fi = 0; fi < m.faces.length; fi++) {
      const f = m.faces[fi], n = faceNormal(m.verts, f)
      for (let k = 0; k < f.length; k++) {
        const a = f[k], b = f[(k + 1) % f.length]
        const key = a < b ? `${a}_${b}` : `${b}_${a}`
        let e = map.get(key)
        if (!e) { e = { a: Math.min(a, b), b: Math.max(a, b), n: [] }; map.set(key, e) }
        e.n.push(n)
      }
    }
    const cosT = Math.cos(creaseDeg * Math.PI / 180)
    map.forEach(e => {
      e.feature = e.n.length === 1 || (e.n.length >= 2 && dot(e.n[0], e.n[1]) < cosT)
      out.push(e)
    })
    return out
  }

  // ---------------- 视图基 ----------------
  function view(name) {
    if (name === 'front') return { u: [1, 0, 0], v: [0, 0, 1], d: [0, 1, 0], name }
    if (name === 'top') return { u: [1, 0, 0], v: [0, -1, 0], d: [0, 0, 1], name }
    if (name === 'left') return { u: [0, 1, 0], v: [0, 0, 1], d: [-1, 0, 0], name }
    if (name === 'iso') {
      const s = 1 / Math.sqrt(3)
      return { u: [1 / Math.SQRT2, -1 / Math.SQRT2, 0], v: [-1 / Math.sqrt(6), -1 / Math.sqrt(6), 2 / Math.sqrt(6)], d: [s, s, s], name }
    }
    if (name === 'cabinet') {
      const k = 0.5 * Math.SQRT1_2
      return { u: [1, k, 0], v: [0, k, 1], d: [0, 1, 0], name }
    }
    throw new Error('unknown view ' + name)
  }

  // ---------------- 投影 + 遮挡 ----------------
  function makeCtx(meshes, V, opts = {}) {
    const tris = []
    let umin = 1e18, umax = -1e18, vmin = 1e18, vmax = -1e18
    const proj = p => ({ u: dot(p, V.u), v: dot(p, V.v), d: dot(p, unit(V.d)) })
    meshes.forEach(m => {
      const P = m.verts.map(proj)
      m._P = P
      P.forEach(q => {
        umin = Math.min(umin, q.u); umax = Math.max(umax, q.u)
        vmin = Math.min(vmin, q.v); vmax = Math.max(vmax, q.v)
      })
      m.faces.forEach(f => {
        for (let i = 1; i < f.length - 1; i++) {
          const A = P[f[0]], B = P[f[i]], C = P[f[i + 1]]
          const den = (B.u - A.u) * (C.v - A.v) - (C.u - A.u) * (B.v - A.v)
          if (Math.abs(den) < 1e-12) continue
          tris.push({
            a: A, b: B, c: C, den, mi: meshes.indexOf(m),
            bbox: [Math.min(A.u, B.u, C.u), Math.min(A.v, B.v, C.v), Math.max(A.u, B.u, C.u), Math.max(A.v, B.v, C.v)],
            cells: [],
          })
        }
      })
    })
    const size = Math.max(umax - umin, vmax - vmin, 1)
    const cell = Math.max(size / 90, 0.05)
    const cx0 = umin, cy0 = vmin
    const grid = new Map()
    const key = (i, j) => i * 100003 + j
    tris.forEach((t, ti) => {
      const [x0, y0, x1, y1] = t.bbox
      const i0 = Math.floor((x0 - cx0) / cell), i1 = Math.floor((x1 - cx0) / cell)
      const j0 = Math.floor((y0 - cy0) / cell), j1 = Math.floor((y1 - cy0) / cell)
      if ((i1 - i0 + 1) * (j1 - j0 + 1) > 900) { (grid.get('big') || grid.set('big', []).get('big')).push(ti); return }
      for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
        const k = key(i, j)
        let arr = grid.get(k)
        if (!arr) { arr = []; grid.set(k, arr) }
        arr.push(ti)
      }
    })
    const big = grid.get('big') || []
    const modelSize = size
    function occluded(q, eps, skipMesh = -99) {
      const i = Math.floor((q.u - cx0) / cell), j = Math.floor((q.v - cy0) / cell)
      const lists = [grid.get(key(i, j)) || [], big]
      for (const list of lists) {
        for (let li = 0; li < list.length; li++) {
          const t = tris[list[li]]
          if (t.mi === skipMesh) continue
          const A = t.a, B = t.b, C = t.c
          const x = q.u, y = q.v
          const w1 = ((x - A.u) * (C.v - A.v) - (C.u - A.u) * (y - A.v)) / t.den
          const w2 = ((B.u - A.u) * (y - A.v) - (x - A.u) * (B.v - A.v)) / t.den
          if (w1 < -1e-6 || w2 < -1e-6 || w1 + w2 > 1 + 1e-6) continue
          const dep = A.d + w1 * (B.d - A.d) + w2 * (C.d - A.d)
          if (dep > q.d + eps) return true
        }
      }
      return false
    }
    return { proj, occluded, tris, umin, umax, vmin, vmax, eps: modelSize * 1e-4 + 1e-4, cell }
  }

  /* 隐藏线消除：返回 {vis:[[[u,v]...]], hid:[...]} */
  function hlr(meshes, V, stepMM = 1) {
    const ctx = makeCtx(meshes, V)
    const vis = [], hid = []
    const eps = ctx.eps
    const D = unit(V.d)
    meshes.forEach((m, mi) => {
      const edges = buildEdges(m)
      edges.forEach(e => {
        const a = m.verts[e.a], b = m.verts[e.b]
        let sil = false
        if (e.n.length === 2) {
          const s1 = dot(e.n[0], D), s2 = dot(e.n[1], D)
          sil = (s1 > 0 && s2 < 0) || (s1 < 0 && s2 > 0)
        }
        if (!sil && !e.feature) return
        // 局部可见性：至少有一个相邻面朝向观察者
        const localVis = e.n.length === 1
          ? dot(e.n[0], D) > 0
          : (dot(e.n[0], D) > 1e-6 || dot(e.n[1], D) > 1e-6)
        const pa = ctx.proj(a), pb = ctx.proj(b)
        const L = Math.hypot(pb.u - pa.u, pb.v - pa.v)
        if (L < 1e-6) return
        const n = Math.max(2, Math.min(260, Math.ceil(L / stepMM)))
        const flags = new Array(n + 1)
        for (let k = 0; k <= n; k++) {
          const t = k / n
          const q = { u: pa.u + (pb.u - pa.u) * t, v: pa.v + (pb.v - pa.v) * t, d: pa.d + (pb.d - pa.d) * t }
          flags[k] = localVis && !ctx.occluded(q, eps, mi)
        }
        let start = 0
        for (let k = 1; k <= n; k++) {
          if (flags[k] !== flags[start]) {
            pushRun([flags[start], start, k])
            start = k
          }
        }
        pushRun([flags[start], start, n])
        function pushRun([f, k0, k1]) {
          const pts = []
          for (let k = k0; k <= k1; k++) {
            const t = k / n
            pts.push([+(pa.u + (pb.u - pa.u) * t).toFixed(3), +(pa.v + (pb.v - pa.v) * t).toFixed(3)])
          }
          if (pts.length < 2) return
          // 组合体：落在其他实体内部的线段不画
          if (meshes.length > 1) {
            const t0 = k0 / n
            const p3 = lerp3(a, b, t0 + 0.001)
            for (let j = 0; j < meshes.length; j++) {
              if (j !== mi && inside(meshes[j], p3)) return
            }
          }
          ;(f ? vis : hid).push(pts)
        }
      })
    })
    return { vis, hid, ctx }
  }

  // 点是否被遮挡
  function pointVisible(meshes, V, p) {
    const ctx = makeCtx(meshes, V)
    const q = ctx.proj(p)
    return !ctx.occluded(q, ctx.eps)
  }

  /* 对给定三维折线做隐藏线消除（用于并集/相贯线等自定义边）
   * runs: [[p,p,...]] 或 [{pts, e, mi}]
   */
  function hlrPolys(meshes, runs, V, stepMM = 0.5) {
    const ctx = makeCtx(meshes, V)
    const vis = [], hid = []
    const D = unit(V.d)
    runs.forEach(run => {
      const pts = Array.isArray(run) ? run : run.pts
      const mi = Array.isArray(run) ? -99 : (run.mi ?? -99)
      const force = !Array.isArray(run) && !!run.force
      let localVis = true
      if (!Array.isArray(run) && run.e && run.e.n) {
        const ns = run.e.n
        localVis = ns.length === 1 ? dot(ns[0], D) > 0 : ns.some(n => dot(n, D) > 1e-6)
      }
      for (let s = 0; s < pts.length - 1; s++) {
        const a = pts[s], b = pts[s + 1]
        const pa = ctx.proj(a), pb = ctx.proj(b)
        const L = Math.hypot(pb.u - pa.u, pb.v - pa.v)
        if (L < 1e-6) continue
        const n = Math.max(1, Math.min(200, Math.ceil(L / stepMM)))
        let cur = null
        for (let k = 0; k <= n; k++) {
          const t = k / n
          const q = { u: pa.u + (pb.u - pa.u) * t, v: pa.v + (pb.v - pa.v) * t, d: pa.d + (pb.d - pa.d) * t }
          const ok = force || (localVis && !ctx.occluded(q, ctx.eps, mi))
          if (!cur || cur.ok !== ok) {
            if (cur && cur.pts.length > 1) (cur.ok ? vis : hid).push(cur.pts)
            cur = { ok, pts: [] }
          }
          cur.pts.push([+q.u.toFixed(3), +q.v.toFixed(3)])
        }
        if (cur && cur.pts.length > 1) (cur.ok ? vis : hid).push(cur.pts)
      }
    })
    return { vis, hid, ctx }
  }

  // 点是否在实体内部
  function inside(m, p) {
    const dir = unit([0.37213, 0.54771, 0.74873])
    let cnt = 0
    m.faces.forEach(f => {
      for (let i = 1; i < f.length - 1; i++) {
        const a = m.verts[f[0]], b = m.verts[f[i]], c = m.verts[f[i + 1]]
        const e1 = sub(b, a), e2 = sub(c, a)
        const h = cross(dir, e2)
        const det = dot(e1, h)
        if (Math.abs(det) < 1e-12) continue
        const s = sub(p, a)
        const uu = dot(s, h) / det
        if (uu < 0 || uu > 1) continue
        const qq = cross(s, e1)
        const vv = dot(dir, qq) / det
        if (vv < 0 || uu + vv > 1) continue
        const t = dot(e2, qq) / det
        if (t > 1e-7) cnt++
      }
    })
    return cnt % 2 === 1
  }

  /* 组合体：去掉落在其他实体内部的边段（并集显示）
   * 传入 V 时只保留特征边与轮廓边
   */
  function unionEdges(meshes, stepMM = 1, V = null) {
    const out = []
    const D = V ? unit(V.d) : null
    meshes.forEach((m, mi) => {
      const others = meshes.filter((_, i) => i !== mi)
      buildEdges(m).forEach(e => {
        if (D) {
          const sil = e.n.length === 2 && ((dot(e.n[0], D) > 0) !== (dot(e.n[1], D) > 0))
          if (!e.feature && !sil) return
        } else if (!e.feature) return
        const a = m.verts[e.a], b = m.verts[e.b]
        const L = vlen(sub(b, a))
        const n = Math.max(2, Math.min(120, Math.ceil(L / stepMM)))
        let run = null
        for (let k = 0; k <= n; k++) {
          const p = lerp3(a, b, k / n)
          const inOther = others.some(o => inside(o, p))
          if (!inOther) {
            if (!run) run = { e, mi, pts: [p] }
            else run.pts.push(p)
          } else if (run) { out.push(run); run = null }
        }
        if (run) out.push(run)
      })
    })
    return out
  }

  // 平面切割（凸实体）
  function cut(m, plane, keepPlus = true) {
    const n = plane.n, d = plane.d
    const side = p => (dot(n, p) - d) * (keepPlus ? 1 : -1)
    const verts = [], faces = [], cutPts = []
    const vmap = new Map()
    const addV = (p, key) => {
      if (key && vmap.has(key)) return vmap.get(key)
      const id = verts.length
      verts.push(p)
      if (key) vmap.set(key, id)
      return id
    }
    m.faces.forEach(f => {
      const poly = f.map(i => m.verts[i])
      const inside = poly.map(p => side(p) >= -1e-9)
      if (inside.every(x => !x)) return
      const out = []
      for (let i = 0; i < poly.length; i++) {
        const A = poly[i], B = poly[(i + 1) % poly.length]
        const ia = inside[i], ib = inside[(i + 1) % poly.length]
        if (ia) out.push(A)
        if (ia !== ib) {
          const da = side(A), db = side(B)
          const t = da / (da - db)
          const P = lerp3(A, B, t)
          out.push(P)
          cutPts.push(P)
        }
      }
      if (out.length >= 3) {
        const key = out.map(p => p.map(x => x.toFixed(4)).join(',')).join('|')
        faces.push(out.map(p => addV(p, p.map(x => x.toFixed(4)).join(','))))
      }
    })
    // 切口端面
    if (cutPts.length >= 3) {
      // 去重
      const uniq = []
      cutPts.forEach(p => {
        if (!uniq.some(q => vlen(sub(p, q)) < 1e-6)) uniq.push(p)
      })
      const c = mul(uniq.reduce((s, p) => add(s, p), [0, 0, 0]), 1 / uniq.length)
      // 平面基
      const e1 = unit(Math.abs(n[0]) < 0.9 ? cross(n, [1, 0, 0]) : cross(n, [0, 1, 0]))
      const e2 = cross(n, e1)
      const sorted = uniq.slice().sort((p, q) =>
        Math.atan2(dot(sub(p, c), e2), dot(sub(p, c), e1)) - Math.atan2(dot(sub(q, c), e2), dot(sub(q, c), e1)))
      const ids = sorted.map(p => addV(p, p.map(x => x.toFixed(4)).join(',')))
      const fa = ids.slice()
      const nrm = faceNormal(verts, fa)
      if (dot(nrm, mul(n, keepPlus ? -1 : 1)) < 0) fa.reverse()
      faces.push(fa)
    }
    return { verts, faces, name: m.name }
  }

  return {
    mesh, prism, pyramid, frustum, cylinder, cone, sphere, box, extrude,
    faceNormal, faceCenter, orientOut, buildEdges, view, makeCtx, hlr, hlrPolys, pointVisible, inside, unionEdges, cut,
    sub, add, mul, dot, cross, vlen, unit, lerp3, TAU,
  }
})()

  // ===== js/views.js =====
/* Views — 三视图场面调度
 * 输入实体网格，输出符合制图规范的三视图（长对正/高平齐/宽相等），
 * 支持表面取点的三面投影、45° 辅助线、中心线
 */
const Views = (() => {
  const P = Paper.P

  function scene(meshes, opts = {}) {
    const gap = opts.gap ?? 14
    const step = opts.step ?? 0.4
    const names = ['front', 'top', 'left']
    const V = {}, C = {}, B = {}, H = {}
    names.forEach(n => {
      V[n] = GEO.view(n)
      C[n] = GEO.makeCtx(meshes, V[n])
      B[n] = { u0: C[n].umin, u1: C[n].umax, v0: C[n].vmin, v1: C[n].vmax }
      H[n] = GEO.hlr(meshes, V[n], step)
      if (opts.extraPolys && opts.extraPolys.length) {
        const ex = GEO.hlrPolys(meshes, opts.extraPolys, V[n], step)
        H[n].vis.push(...ex.vis)
        H[n].hid.push(...ex.hid)
      }
    })
    const W = B.front.u1 - B.front.u0
    const HT = B.front.v1 - B.front.v0
    const D = B.top.v1 - B.top.v0
    const off = { front: [0, 0], top: [0, -gap - D], left: [W + gap, 0] }
    const map = (n, u, v) => [u - B[n].u0 + off[n][0], v - B[n].v0 + off[n][1]]
    const sheet = { x0: 0, x1: W + gap + D, y0: -gap - D, y1: HT }
    const p45a = [W + gap, -gap], p45b = [W + gap + D, -gap - D]

    function outline(n) {
      const els = []
      H[n].vis.forEach(pl => els.push(Paper.poly(pl.map(q => map(n, q[0], q[1])), 'solid', false, { grp: n })))
      H[n].hid.forEach(pl => els.push(Paper.poly(pl.map(q => map(n, q[0], q[1])), 'hidden', false, { grp: n })))
      return els
    }

    // 视图中心线（回转轴 / 对称面）
    function centerLines(axis) {
      const els = []
      const L = 4
      if (!axis) return els
      const { cx = 0, cy = 0 } = axis
      // 主视图：竖直线 x=cx
      els.push(Paper.line([map('front', cx, 0)[0], map('front', 0, B.front.v0 - L)[1]],
        [map('front', cx, 0)[0], map('front', 0, B.front.v1 + L)[1]], 'center'))
      // 俯视图：十字
      const fTop = map('top', cx, B.top.v1)
      const fBot = map('top', cx, B.top.v0)
      els.push(Paper.line([fTop[0], fTop[1] + L], [fBot[0], fBot[1] - L], 'center'))
      const tL = map('top', B.top.u0 - L, cy)
      const tR = map('top', B.top.u1 + L, cy)
      els.push(Paper.line(tL, tR, 'center'))
      // 左视图：竖直线 y=cy
      const lTop = map('left', cy, B.left.v1)
      const lBot = map('left', cy, B.left.v0)
      els.push(Paper.line([lTop[0], lTop[1] + L], [lBot[0], lBot[1] - L], 'center'))
      return els
    }

    function line45() {
      return [Paper.line(p45a, p45b, 'thin', { color: Paper.C.con, dash: [2, 1.5], noAnim: true })]
    }

    // 一个空间点在三个视图中的投影（含可见性、标注、投影连线）
    function point(p, name, o = {}) {
      const labels = { front: name + '′', top: name, left: name + '″' }
      const metas = {}, parts = {}
      names.forEach(n => {
        const q = C[n].proj(p)
        const vis = (o.vis && o.vis[n] !== undefined) ? o.vis[n] : !C[n].occluded(q, C[n].eps)
        metas[n] = { pos: map(n, q.u, q.v), vis, label: labels[n], q }
      })
      names.forEach(n => {
        const m = metas[n]
        const off = { front: [2.4, 2.0], top: [2.4, 2.0], left: [2.4, 2.0] }[n]
        parts[n] = Paper.pointMark(m.pos, m.label, {
          color: o.color || Paper.C.pick, hidden: !m.vis, off, size: 3.2,
        })
      })
      const f = metas.front.pos, t = metas.top.pos, l = metas.left.pos
      const links = {
        ft: o.links === false ? [] : [Paper.line([f[0], f[1] - 2], [t[0], t[1] + 2], 'thin', { color: Paper.C.con, dash: [2.2, 1.4], noAnim: true })],
        fl: o.links === false ? [] : [Paper.line([f[0] + 2, f[1]], [l[0] - 2, l[1]], 'thin', { color: Paper.C.con, dash: [2.2, 1.4], noAnim: true })],
        tl: o.links === false ? [] : (() => {
          const x45 = W - t[1]
          return [Paper.line([t[0] + 2, t[1]], [x45, t[1]], 'thin', { color: Paper.C.con, dash: [2.2, 1.4], noAnim: true }),
            Paper.line([x45, t[1]], [x45, l[1]], 'thin', { color: Paper.C.con, dash: [2.2, 1.4], noAnim: true })]
        })(),
      }
      return { parts, links, metas, els: [...parts.front, ...parts.top, ...parts.left, ...links.ft, ...links.fl, ...links.tl] }
    }

    return { meshes, V, C, B, H, W, HT, D, gap, off, map, sheet, outline, centerLines, line45, point, p45a, p45b }
  }

  // 轴测图
  function axonometric(meshes, kind = 'iso', opts = {}) {
    const V = GEO.view(kind)
    const H = GEO.hlr(meshes, V, opts.step ?? 0.35)
    const els = []
    H.vis.forEach(pl => els.push(Paper.poly(pl, 'solid')))
    H.hid.forEach(pl => els.push(Paper.poly(pl, 'hidden')))
    return { els, H, V }
  }

  return { scene, axonometric }
})()

  // ===== js/templates.js =====
/* Templates — 画法几何 / 三视图 题库
 * 每个模板 build(prm) 返回 { title, steps:[{title,desc,els}] }
 */
const Templates = (() => {
  const P = Paper.P, TAU = Math.PI * 2, C = Paper.C
  const T = {}
  function def(id, cat, name, build, tip = '') { T[id] = { id, cat, name, build, tip } }
  const step = (title, desc, els) => ({ title, desc, els: (els || []).filter(Boolean) })

  /* ---------- 抽象三视图布局（点线面投影） ---------- */
  function planeScene(W, H, D, gap = 13) {
    const map = {
      front: (u, v) => [u, v],
      top: (u, v) => [u, -gap - v],          // v: 0=后, D=前
      left: (u, v) => [W + gap + u, v],      // u: 0=后, D=前
    }
    return { W, H, D, gap, map, sheet: { x0: -10, x1: W + gap + D + 10, y0: -gap - D - 12, y1: H + 12 } }
  }

  function axes(ps) {
    const els = [], { W, H, D, gap, map } = ps
    const ln = (a, b) => els.push(Paper.line(a, b, 'center', { color: '#5a6570' }))
    const tx = (p, s, an = 'start') => els.push(Paper.text(p, s, { size: 2.8, color: '#5a6570', anchor: an }))
    ln(map.front(-6, 0), map.front(W + 5, 0)); tx(map.front(W + 6, 0), 'X')
    ln(map.front(0, -6), map.front(0, H + 5)); tx(map.front(0, H + 7), 'Z', 'middle')
    tx(map.front(-2.5, -2.6), 'O')
    ln(map.top(-6, 0), map.top(W + 5, 0)); tx(map.top(W + 6, 0), 'X')
    ln(map.top(0, 0), map.top(0, D + 5)); tx(map.top(0, D + 7), 'Y', 'middle')
    tx(map.top(-2.5, -2.6), 'O')
    ln(map.left(0, 0), map.left(D + 5, 0)); tx(map.left(D + 6, 0), 'Y')
    ln(map.left(0, -5), map.left(0, H + 5)); tx(map.left(0, H + 7), 'Z', 'middle')
    tx(map.left(-2.5, -2.6), 'O')
    const p0 = [W + gap, -gap]
    els.push(Paper.line(p0, [p0[0] + D + 4, p0[1] - D - 4], 'thin', { color: C.con, dash: [2, 1.4], noAnim: true }))
    return els
  }

  /* =========================================================
   * 一、点线面投影
   * ========================================================= */
  def('point3', 'point', '点的三面投影', (prm = {}) => {
    const x = prm.x ?? 34, y = prm.y ?? 20, z = prm.z ?? 26
    const W = 48, H = 38, D = 30
    const ps = planeScene(W, H, D), M = ps.map
    const aF = M.front(x, z), aT = M.top(x, y), aL = M.left(y, z)
    const x45 = W - aT[1]
    return {
      title: `点的三面投影 A(${x}, ${y}, ${z})`,
      steps: [
        step('1. 建立三投影面体系', '画出 OX、OZ、OY 三条投影轴，并在右下方作 45° 辅助线——它是俯视图与左视图之间"宽相等"的桥梁。', axes(ps)),
        step('2. 作正面投影 a′', `在 V 面内：自 O 点向右量取 x=${x}，向上量取 z=${z}，得 a′。`, [Paper.pointMark(aF, 'a′', { color: C.aux, off: [-1.6, 1.6], anchor: 'end' })]),
        step('3. 作水平投影 a', `由 a′ 向下作投影连线（长对正）；在 H 面内量取 y=${y}，得 a。`, [
          Paper.line([aF[0], aF[1] - 1.5], [aT[0], aT[1] + 1.5], 'thin', { color: C.con, dash: [2.2, 1.4], noAnim: true }),
          ...Paper.pointMark(aT, 'a', { color: C.pick, off: [1.6, -1.8] }),
        ]),
        step('4. 作侧面投影 a″', '由 a 向右引水平线交 45° 线，再竖直向上（宽相等）；与 a′ 引出的水平线相交，得 a″。', [
          Paper.line([aT[0] + 1.5, aT[1]], [x45, aT[1]], 'thin', { color: C.con, dash: [2.2, 1.4], noAnim: true }),
          Paper.line([x45, aT[1]], [x45, aL[1]], 'thin', { color: C.con, dash: [2.2, 1.4], noAnim: true }),
          Paper.line([aF[0] + 1.5, aF[1]], [aL[0] + 3, aL[1]], 'thin', { color: C.con, dash: [2.2, 1.4], noAnim: true }),
          ...Paper.pointMark(aL, 'a″', { color: C.pick, off: [1.6, 1.6] }),
        ]),
        step('5. 归纳', 'a′a ⊥ OX（长对正）；a′a″ ⊥ OZ（高平齐）；aa″ 由 45° 线保证（宽相等）。这就是三视图的三条基本规律。', []),
      ],
    }
  })

  def('line3', 'point', '直线的三面投影', (prm = {}) => {
    const kind = prm.kind || 'general'
    const W = 50, H = 42, D = 34
    const ps = planeScene(W, H, D), M = ps.map
    let A, B
    if (kind === 'horizontal') { A = [12, 18, 24]; B = [40, 18, 24] }
    else { A = [10, 10, 10]; B = [40, 28, 30] }
    const pr = (p, k) => k === 'front' ? [p[0], p[2]] : k === 'top' ? [p[0], p[1]] : [p[1], p[2]]
    const seg = k => Paper.line(M[k](...pr(A, k)), M[k](...pr(B, k)), 'thick', { color: C.pick })
    const labs = k => [
      ...Paper.pointMark(M[k](...pr(A, k)), k === 'front' ? 'a′' : k === 'top' ? 'a' : 'a″', { color: C.aux, off: [-1.6, -1.8], anchor: 'end' }),
      ...Paper.pointMark(M[k](...pr(B, k)), k === 'front' ? 'b′' : k === 'top' ? 'b' : 'b″', { color: C.aux, off: [1.6, 1.6] }),
    ]
    return {
      title: kind === 'horizontal' ? '水平线的三面投影' : '一般位置直线的三面投影',
      steps: [
        step('1. 定出两端点', '先按坐标在三个投影面内定出 A、B 两点的各面投影。', [...axes(ps), ...labs('front'), ...labs('top'), ...labs('left')]),
        step('2. 连正面投影', '同面投影相连：a′b′ 即直线 AB 的正面投影。', [seg('front')]),
        step('3. 连水平投影', 'ab 为水平投影，与 a′b′ 长对正。', [seg('top')]),
        step('4. 连侧面投影', 'a″b″ 为侧面投影，由 45° 线保证宽相等。', [seg('left')]),
        step('5. 投影特性', kind === 'horizontal'
          ? '水平线平行于 H 面：水平投影反映实长，与 OX 轴的夹角反映真实倾角；正面、侧面投影分别平行于 OX、OY 轴且长度缩短。'
          : '一般位置直线与三个投影面都倾斜：三面投影均短于实长，也不反映真实倾角。求实长需用直角三角形法。', []),
      ],
    }
  })

  def('plane3', 'point', '平面的三面投影（正垂面）', () => {
    const W = 54, H = 44, D = 36
    const ps = planeScene(W, H, D), M = ps.map
    const A = [12, 10, 16], B = [46, 34, 33], Cc = [26, 30, 23]
    const pr = (p, k) => k === 'front' ? [p[0], p[2]] : k === 'top' ? [p[0], p[1]] : [p[1], p[2]]
    const tri = k => Paper.poly([M[k](...pr(A, k)), M[k](...pr(B, k)), M[k](...pr(Cc, k))], 'thick', true, { color: C.pick })
    const labs = k => [A, B, Cc].map((p, i) =>
      Paper.text(M[k](...pr(p, k)), ['a', 'b', 'c'][i] + (k === 'front' ? '′' : k === 'left' ? '″' : ''), { size: 3, color: C.aux }))
    return {
      title: '正垂面的三面投影',
      steps: [
        step('1. 建立投影体系', '仍用三投影面体系与 45° 辅助线。', axes(ps)),
        step('2. 定出三顶点', 'A、B、C 三点的 z 坐标满足 z = 0.5x + 10：三点共面，且该面垂直于 V 面。', [...labs('front'), ...labs('top'), ...labs('left')]),
        step('3. 正面投影', '正垂面垂直于 V 面，正面投影积聚成一条斜线 a′b′c′——这是投影面垂直面最重要的特性。', [tri('front')]),
        step('4. 水平投影', '水平投影 abc 是三角形，但不反映实形。', [tri('top')]),
        step('5. 侧面投影', '侧面投影同样是三角形，也不反映实形。', [tri('left')]),
        step('6. 结论', '投影面垂直面的投影特性：一个投影积聚成线，另外两个投影为类似形。', []),
      ],
    }
  })

  /* =========================================================
   * 二、基本体三视图 + 表面取点
   * ========================================================= */
  const SOLID_STEPS = (S, axis, tips) => [
    step('1. 画基准线', '先画中心线和基准线，确定三个视图的位置。', S.centerLines(axis)),
    step('2. 画俯视图', tips.top, S.outline('top')),
    step('3. 画主视图', tips.front, S.outline('front')),
    step('4. 画左视图', tips.left, [...S.line45(), ...S.outline('left')]),
  ]

  def('prism3', 'solid', '棱柱三视图与表面取点', (prm = {}) => {
    const n = prm.sides ?? 5, R = prm.R ?? 30, h = prm.h ?? 45
    const m = GEO.prism({ n, R, h, rot: Math.PI / 2 })
    const S = Views.scene([m], { gap: 14 })
    const faceP = (i, t, zf) => {
      const a0 = Math.PI / 2 + i * TAU / n, a1 = a0 + TAU / n
      const a = a0 + (a1 - a0) * t
      return [R * Math.cos(a), R * Math.sin(a), zf * h]
    }
    const A = faceP(0, 0.45, 0.58)
    const B = faceP(3, 0.40, 0.62)
    const pa = S.point(A, 'a', { vis: { top: true } })
    const pb = S.point(B, 'b', { vis: { top: true } })
    return {
      title: `${n} 棱柱三视图与表面取点`,
      steps: [
        ...SOLID_STEPS(S, { cx: 0, cy: 0 }, {
          top: `${n} 棱柱的俯视图反映底面实形（正 ${n} 边形），主、左视图为矩形。`,
          front: '按"长对正"由俯视图向上投影，高度取 h，得主视图。前棱线把主视图分成两块可见棱面。',
          left: '按"高平齐、宽相等"由 45° 线求得左视图，后面的棱线不可见，画虚线。',
        }),
        step('5. 已知条件', 'a′ 在前左棱面上，可见；(b′) 在右后棱面上，正面投影被前面遮挡，加括号表示不可见。',
          [...pa.parts.front, ...pb.parts.front]),
        step('6. 求 A 的另外两投影', '由 a′ 向下作投影连线，交俯视图前左棱边得 a（可见）；再由 a 经 45° 线求得 a″。',
          [...pa.links.ft, ...pa.parts.top, ...pa.links.tl, ...pa.parts.left]),
        step('7. 求 B 的另外两投影', '由 (b′) 向下作投影连线，交俯视图右后棱边得 b；B 在右侧棱面上，左视图投影不可见，记作 (b″)。',
          [...pb.links.ft, ...pb.parts.top, ...pb.links.tl, ...pb.parts.left]),
        step('8. 检查', '长对正：a′、a 在同一竖直线上；高平齐：a′、a″ 在同一水平线上；宽相等：由 45° 线保证。', []),
      ],
    }
  })

  def('pyramid3', 'solid', '棱锥三视图与表面取点', (prm = {}) => {
    const n = prm.sides ?? 4, R = prm.R ?? 28, h = prm.h ?? 46
    const m = GEO.pyramid({ n, R, h, rot: Math.PI / 4 })
    const S = Views.scene([m], { gap: 14 })
    const fp = (fi, s, t) => {
      const f = m.faces[fi]
      const A0 = m.verts[f[0]], B0 = m.verts[f[1]], C0 = m.verts[f[2]]
      return GEO.lerp3(GEO.lerp3(A0, B0, s), C0, t)
    }
    const A = fp(0, 0.45, 0.5)
    const B = fp(2, 0.55, 0.35)
    const pa = S.point(A, 'a', { vis: { top: true } })
    const pb = S.point(B, 'b', { vis: { top: false } })
    const fB = m.faces[2]
    const baseB = GEO.lerp3(m.verts[fB[0]], m.verts[fB[1]], 0.55)
    const apex = m.verts[m.verts.length - 1]
    const aux = ['front', 'top', 'left'].map(k => {
      const Vv = GEO.view(k)
      return Paper.line(S.map(k, GEO.dot(baseB, Vv.u), GEO.dot(baseB, Vv.v)),
        S.map(k, GEO.dot(apex, Vv.u), GEO.dot(apex, Vv.v)),
        'thin', { color: C.aux, dash: [2.4, 1.4], noAnim: true })
    })
    return {
      title: `${n} 棱锥三视图与表面取点`,
      steps: [
        ...SOLID_STEPS(S, { cx: 0, cy: 0 }, {
          top: '底面为正多边形，俯视图反映实形；锥顶的投影在中心。',
          front: '主视图为三角形，底边为底面投影，顶点为锥顶。',
          left: '左视图同样是三角形，按高平齐、宽相等作出。',
        }),
        step('5. 已知条件', 'a′、b′ 分别在左前、右后棱面上。', [...pa.parts.front, ...pb.parts.front]),
        step('6. 求 A 的另外两投影', 'A 在左前棱面上：由 a′ 向下作投影连线，落在该棱面的水平投影内得 a；再由 45° 线求 a″。',
          [...pa.links.ft, ...pa.parts.top, ...pa.links.tl, ...pa.parts.left]),
        step('7. 用辅助素线求 B', '过锥顶 S 与 B 作辅助素线并延长到基边：先求基边点的三面投影，再在素线上定出 B。这是棱锥表面取点的基本方法。',
          [...aux, ...pb.links.ft, ...pb.parts.top, ...pb.links.tl, ...pb.parts.left]),
        step('8. 注意', '棱锥表面取点：点所在棱面在某个视图中不可见时，该投影也应加括号。', []),
      ],
    }
  })

  def('cylinder3', 'solid', '圆柱三视图与表面取点', (prm = {}) => {
    const r = prm.r ?? 22, h = prm.h ?? 46
    const m = GEO.cylinder({ r, h, seg: 72 })
    const S = Views.scene([m], { gap: 14 })
    const P3 = (th, zf) => [r * Math.cos(th), r * Math.sin(th), zf * h]
    const A = P3(Math.PI * 0.66, 0.62)
    const B = P3(-Math.PI * 0.33, 0.4)
    const pa = S.point(A, 'a', { vis: { top: true } })
    const pb = S.point(B, 'b', { vis: { top: true } })
    const aux = ['front', 'top', 'left'].map(k => {
      const Vv = GEO.view(k)
      return Paper.line(S.map(k, GEO.dot([B[0], B[1], 0], Vv.u), GEO.dot([B[0], B[1], 0], Vv.v)),
        S.map(k, GEO.dot([B[0], B[1], h], Vv.u), GEO.dot([B[0], B[1], h], Vv.v)),
        'thin', { color: C.aux, dash: [2.4, 1.4], noAnim: true })
    })
    return {
      title: '圆柱三视图与表面取点',
      steps: [
        ...SOLID_STEPS(S, { cx: 0, cy: 0 }, {
          top: '俯视图为圆，反映底面实形；圆心处画十字中心线。',
          front: '主视图为矩形，左右两条竖线是圆柱的最左、最右素线（转向轮廓线）。',
          left: '左视图与主视图完全相同，也是矩形。',
        }),
        step('5. 已知条件', 'a′ 在前半圆柱面上（可见），(b′) 在后半圆柱面上（不可见，加括号）。', [...pa.parts.front, ...pb.parts.front]),
        step('6. 求 A 的另外两投影', '由 a′ 向下作投影连线，交俯视图前半圆得 a；再由 45° 线求 a″，A 在左侧，a″ 可见。',
          [...pa.links.ft, ...pa.parts.top, ...pa.links.tl, ...pa.parts.left]),
        step('7. 用辅助素线求 B', 'B 在圆柱面上，过 B 作竖直辅助素线（俯视图为一根径向线），先求素线的各面投影，再在素线上定 B。',
          [...aux, ...pb.links.ft, ...pb.parts.top, ...pb.links.tl, ...pb.parts.left]),
        step('8. 要点', '圆柱面取点：水平投影一定落在圆周上——这是"积聚性"带来的便利。', []),
      ],
    }
  })

  def('cone3', 'solid', '圆锥三视图与表面取点', (prm = {}) => {
    const r = prm.r ?? 25, h = prm.h ?? 48
    const m = GEO.cone({ r, h, seg: 72 })
    const S = Views.scene([m], { gap: 14 })
    const P3 = (th, zf) => [r * (1 - zf) * Math.cos(th), r * (1 - zf) * Math.sin(th), zf * h]
    const A = P3(Math.PI * 0.62, 0.55)
    const B = P3(Math.PI * 0.18, 0.35)
    const pa = S.point(A, 'a', { vis: { top: true } })
    const pb = S.point(B, 'b', { vis: { top: true } })
    const rr = r * (1 - 0.35), zb = 0.35 * h
    const aux = [
      Paper.circle(S.map('top', 0, 0), rr, 'thin', { color: C.aux, dash: [2.4, 1.4], noAnim: true }),
      Paper.line(S.map('front', -rr, zb), S.map('front', rr, zb), 'thin', { color: C.aux, dash: [2.4, 1.4], noAnim: true }),
      Paper.line(S.map('left', -rr, zb), S.map('left', rr, zb), 'thin', { color: C.aux, dash: [2.4, 1.4], noAnim: true }),
    ]
    return {
      title: '圆锥三视图与表面取点',
      steps: [
        ...SOLID_STEPS(S, { cx: 0, cy: 0 }, {
          top: '俯视图为圆，圆心即锥顶的投影。',
          front: '主视图为等腰三角形，两腰是最左、最右素线。',
          left: '左视图与主视图相同。',
        }),
        step('5. 已知条件', 'a′、b′ 均在圆锥面上。', [...pa.parts.front, ...pb.parts.front]),
        step('6. 求 A 的另外两投影', '由 a′ 向下作投影连线，交俯视图相应半径圆得 a；再求 a″。',
          [...pa.links.ft, ...pa.parts.top, ...pa.links.tl, ...pa.parts.left]),
        step('7. 用辅助纬圆求 B', '过 B 作水平辅助平面，与圆锥面交出一个纬圆：俯视图为圆，主、左视图为水平线。B 的各投影必在该纬圆的同面投影上。',
          [...aux, ...pb.links.ft, ...pb.parts.top, ...pb.links.tl, ...pb.parts.left]),
        step('8. 两种方法', '圆锥表面取点有两种方法：辅助素线法、辅助纬圆法。纬圆法对回转体通用，更稳妥。', []),
      ],
    }
  })

  def('sphere3', 'solid', '圆球三视图与表面取点', (prm = {}) => {
    const r = prm.r ?? 28
    const m = GEO.sphere({ r, seg: 48, rings: 26, c: [0, 0, r] })
    const S = Views.scene([m], { gap: 14 })
    const LL = (lon, lat) => [r * Math.cos(lat) * Math.cos(lon), r * Math.cos(lat) * Math.sin(lon), r + r * Math.sin(lat)]
    const A = LL(Math.PI * 0.7, Math.PI * 0.12)
    const B = LL(Math.PI * 1.35, -Math.PI * 0.3)
    const pa = S.point(A, 'a', { vis: { top: true } })
    const pb = S.point(B, 'b', { vis: { top: false } })
    const rr = r * Math.cos(Math.PI * 0.12), zb = r + r * Math.sin(Math.PI * 0.12)
    const aux = [
      Paper.circle(S.map('top', 0, 0), rr, 'thin', { color: C.aux, dash: [2.4, 1.4], noAnim: true }),
      Paper.line(S.map('front', -rr, zb), S.map('front', rr, zb), 'thin', { color: C.aux, dash: [2.4, 1.4], noAnim: true }),
      Paper.line(S.map('left', -rr, zb), S.map('left', rr, zb), 'thin', { color: C.aux, dash: [2.4, 1.4], noAnim: true }),
    ]
    return {
      title: '圆球三视图与表面取点',
      steps: [
        step('1. 画中心线', '球的三视图都是等径圆，先画十字中心线。', S.centerLines({ cx: 0, cy: 0 })),
        step('2. 三个视图', `以球心为圆心、R=${r} 画圆，三个视图完全相同。三个圆分别是球面对三个投影面的转向轮廓线。`,
          [...S.outline('top'), ...S.outline('front'), ...S.line45(), ...S.outline('left')]),
        step('3. 已知条件', 'a′、b′ 在球面上。', [...pa.parts.front, ...pb.parts.front]),
        step('4. 用辅助纬圆求 A', '过 A 作水平纬圆：俯视图为圆（半径由 a′ 的高度决定），主视图为一条水平线。A 的 a 必在该圆上。',
          [...aux, ...pa.links.ft, ...pa.parts.top, ...pa.links.tl, ...pa.parts.left]),
        step('5. 求 B', 'B 在球的左后下方：由 b′ 与辅助纬圆求得 b，再由 45° 线求 b″。注意判断各投影的可见性。',
          [...pb.links.ft, ...pb.parts.top, ...pb.links.tl, ...pb.parts.left]),
        step('6. 要点', '球面取点只能用辅助纬圆法；三个投影都没有积聚性，必须借助纬圆。', []),

  def('prismCut', 'cut', '四棱柱截交（正垂面）', (prm = {}) => {
    const a = 34, h = 52, ang = (prm.angle ?? 32) * Math.PI / 180
    const m = GEO.prism({ n: 4, R: a / Math.SQRT2, h, rot: Math.PI / 4 })
    const nrm = [Math.sin(ang), 0, Math.cos(ang)]
    const d = nrm[2] * h * 0.72
    const cut = GEO.cut(m, { n: nrm, d }, false)
    const S = Views.scene([cut], { gap: 14 })
    const zAt = x => (d - nrm[0] * x) / nrm[2]
    const trace = [Paper.line(S.map('front', -a, zAt(-a)), S.map('front', a, zAt(a)), 'thin', { color: C.aux, dash: [3, 1.6], noAnim: true })]
    return {
      title: '四棱柱被正垂面截切',
      steps: [
        step('1. 分析', '正垂面垂直于 V 面，正面投影积聚为一条斜线；截交线的正面投影就落在这条斜线上。', [...S.line45(), ...trace]),

  def('coneCut', 'cut', '圆锥截交（五种情形）', (prm = {}) => {
    const kind = prm.kind || 'ellipse'
    const r = 26, h = 52
    const m = GEO.cone({ r, h, seg: 72 })
    const alpha = Math.atan2(r, h)
    const crit = Math.PI / 2 - alpha
    let ang = crit - 0.42
    if (kind === 'parabola') ang = crit
    if (kind === 'hyperbola') ang = crit + 0.22
    if (kind === 'circle') ang = 0
    if (kind === 'triangle') ang = crit + 0.3
    const nrm = [Math.sin(ang), 0, Math.cos(ang)]
    const d = kind === 'triangle' ? nrm[2] * h : nrm[2] * h * 0.62
    const cut = GEO.cut(m, { n: nrm, d }, false)
    const S = Views.scene([cut], { gap: 14 })
    const zAt = x => (d - nrm[0] * x) / nrm[2]
    const trace = [Paper.line(S.map('front', -r - 8, zAt(-r - 8)), S.map('front', r + 8, zAt(r + 8)), 'thin', { color: C.aux, dash: [3, 1.6], noAnim: true })]
    const names = { ellipse: '椭圆', parabola: '抛物线', hyperbola: '双曲线', circle: '圆', triangle: '三角形' }
    return {

      steps: [
        step('1. 分析', `截平面与圆锥轴线的夹角同半锥角比较，决定截交线形状。当前情形为：${names[kind]}。`, [...trace, ...S.centerLines({ cx: 0, cy: 0 })]),

      Paper.poly(seamF.map(p => M.front(p[0], p[1])), 'solid', false, { color: C.pick, w: 0.85 }),

        step('1. 画中心线', '先定三个视图的位置和两圆柱轴线的交点。', s1),
        step('2. 画水平大圆柱', '大圆柱轴线水平，主视图为矩形，俯视图为矩形（长度 88），左视图为矩形（高度 48）。', s2),

        step('5. 检查', '画图口诀：先形体分析，后选主视图；先画主要轮廓，后画细节；最后检查长对正、高平齐、宽相等。', []),

  def('axoIso', 'axo', '正等轴测图', () => {

  def('axoCab', 'axo', '斜二轴测图', () => {

  return { T, list: () => Object.values(T), get: id => T[id], def }

  // ===== js/templates2d.js =====
/* Templates2D — 几何作图 / 零件 题库 */
const Templates2D = (() => {
  const P = Paper.P, TAU = Math.PI * 2, C = Paper.C, D2R = Math.PI / 180
  const T = {}
  const def = (id, cat, name, build, tip = '') => { T[id] = { id, cat, name, build, tip } }
  const step = (title, desc, els) => ({ title, desc, els: (els || []).filter(Boolean) })
  const polar = (c, r, a) => [c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)]
  const ang = (c, p) => Math.atan2(p[1] - c[1], p[0] - c[0])

  // 圆心在 O、半径 r：与另一圆 (c2,r2) 的交点（求连接弧圆心用）
  function circleX(c1, r1, c2, r2) {
    const d = Math.hypot(c2[0] - c1[0], c2[1] - c1[1])
    if (d > r1 + r2 || d < Math.abs(r1 - r2) || d === 0) return []
    const a = (r1 * r1 - r2 * r2 + d * d) / (2 * d)
    const h = Math.sqrt(Math.max(0, r1 * r1 - a * a))
    const mx = c1[0] + a * (c2[0] - c1[0]) / d, my = c1[1] + a * (c2[1] - c1[1]) / d
    const ux = -(c2[1] - c1[1]) / d, uy = (c2[0] - c1[0]) / d
    return [[mx + h * ux, my + h * uy], [mx - h * ux, my - h * uy]]
  }
  // 弧（角度制，逆时针从 a0 到 a1）
  const arc = (c, r, a0, a1, st = 'solid', o = {}) => Paper.arc(c, r, a0 * D2R, a1 * D2R, st, o)

  /* =========================================================
   * 吊钩平面图形（对应教材 1-8 图）
   * ========================================================= */
  def('hook', 'draw', '吊钩平面图形（圆弧连接）', () => {
    const O = [0, 0], R40 = 40, R20 = 20
    const SX = 10, PY = 8, TOP = 85, SHOULDER = 70
    const TIP = [-Math.sqrt(34 * 34 - 13 * 13), -13]      // 钩尖圆心：距 O 34、向下 13
    // 右 R15：与 x=SX 相切、与 R40 外切
    const cr = [SX + 15, Math.sqrt(55 * 55 - (SX + 15) ** 2)]
    // 左 R15：与 x=-SX 相切、与 R20 外切
    const cl = [-(SX + 15), Math.sqrt(35 * 35 - (SX + 15) ** 2)]
    // R34：与 R40 内切、与 R4 外切
    const angTip = Math.atan2(TIP[1], TIP[0])
    const c34 = (() => {
      const rO = R40 - 34, d = 38
      const cos = (d * d - rO * rO - 34 * 34) / (-2 * rO * 34)
      const t = Math.acos(Math.max(-1, Math.min(1, cos)))
      return [rO * Math.cos(angTip + t), rO * Math.sin(angTip + t)]
    })()
    // R32：与 R20 内切、与 R4 外切
    const c32 = (() => {
      const rO = 32 - 20, d = 36
      const cos = (d * d - rO * rO - 34 * 34) / (-2 * rO * 34)
      const t = Math.acos(Math.max(-1, Math.min(1, cos)))
      return [rO * Math.cos(angTip + t), rO * Math.sin(angTip + t)]
    })()
    const T = {
      pR40: polar(O, R40, Math.atan2(cr[1], cr[0])),
      pTip34: polar(TIP, 4, Math.atan2(c34[1] - TIP[1], c34[0] - TIP[0])),
      pR34: polar(O, R40, Math.atan2(c34[1], c34[0])),
      pR20L: polar(O, R20, Math.atan2(cl[1], cl[0])),
      pTip32: polar(TIP, 4, Math.atan2(c32[1] - TIP[1], c32[0] - TIP[0])),
      pR20_32: polar(O, R20, Math.atan2(c32[1], c32[0])),
    }
    const deg = p => Math.atan2(p[1], p[0]) * 180 / Math.PI
    // 从 p1 到 p2 的弧，dir=+1 逆时针 / -1 顺时针
    function arcDir(c, r, p1, p2, dir, st = 'thick', o = {}) {
      let a0 = ang(c, p1) / D2R, a1 = ang(c, p2) / D2R
      if (dir > 0) { while (a1 < a0) a1 += 360 } else { while (a1 > a0) a1 -= 360 }
      const lo = Math.min(a0, a1), hi = Math.max(a0, a1)
      return arc(c, r, lo, hi, st, { color: C.pick, ...o })
    }

  // ===== js/drawingdoc.js =====
/* DrawingDoc — 大模型图纸契约
 * 结构：{version, meta:{title,width,height,summary,confidence,standard,unit}, warnings[], steps:[{id,title,narration,primitives[]}]}
 * 图元：line / circle / arc / dimension / text / point
 * 坐标：SVG 用户坐标（y 向下）。转成 Paper 图纸坐标（y 向上）时统一翻转。
 */
const DrawingDoc = (() => {
  const CANVAS = { w: 920, h: 660 }
  const PAD = 34

  const LINE_ALIAS = {
    thick: 'thick', thin: 'thin', dashed: 'dashed', center: 'center',
    粗实线: 'thick', 细实线: 'thin', 细虚线: 'dashed', 虚线: 'dashed',
    点画线: 'center', 细点画线: 'center', 中心线: 'center',
    solid: 'thick', hidden: 'dashed', dashdot: 'center',
  }
  const STYLE = { thick: 'solid', thin: 'thin', dashed: 'hidden', center: 'center' }

  const num = v => {
    if (typeof v === 'number' && Number.isFinite(v)) return v
    if (typeof v === 'string' && v.trim() !== '' && Number.isFinite(Number(v))) return Number(v)
    return null
  }
  const str = v => (typeof v === 'string' && v.trim() ? v.trim() : undefined)
  const rec = v => v && typeof v === 'object' && !Array.isArray(v)

  /* 从模型输出里抠出 JSON：容忍围栏、前后废话、多重包装 */
  function parseLoose(raw) {
    if (rec(raw)) return raw
    if (typeof raw !== 'string') return null
    let s = raw.trim()
    s = s.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/i, '').trim()
    const start = s.indexOf('{')
    const end = s.lastIndexOf('}')
    if (start === -1 || end <= start) return null
    s = s.slice(start, end + 1)
    try { return JSON.parse(s) } catch { /* 常见：中文引号、尾逗号 */ }
    try {
      return JSON.parse(s.replace(/[“”]/g, '"').replace(/,\s*([}\]])/g, '$1'))
    } catch { return null }
  }

  /* ---------- 归一化：能修就修，修不了才丢 ---------- */
  function normalize(raw, opts = {}) {
    const issues = []
    const payload = parseLoose(raw)
    if (!rec(payload)) return { doc: null, issues: [{ level: 'error', msg: '无法从返回内容中解析出 JSON' }] }

    const metaRaw = rec(payload.meta) ? payload.meta : {}
    const W = num(metaRaw.width) || opts.width || CANVAS.w
    const H = num(metaRaw.height) || opts.height || CANVAS.h
    const clampX = v => Math.max(PAD, Math.min(W - PAD, v))
    const clampY = v => Math.max(PAD, Math.min(H - PAD, v))

    if (!Array.isArray(payload.steps) || !payload.steps.length) {
      return { doc: null, issues: [{ level: 'error', msg: 'steps 缺失或为空' }] }
    }

    const ids = new Set()
    const uid = (id, fb) => {
      let v = id && !ids.has(id) ? id : fb
      let n = 2
      while (ids.has(v)) v = `${fb}-${n++}`
      ids.add(v)
      return v
    }
    const clampPt = (p, path) => {
      if (!rec(p)) { issues.push({ level: 'error', msg: `${path} 坐标缺失` }); return null }
      const x = num(p.x), y = num(p.y)
      if (x === null || y === null) { issues.push({ level: 'error', msg: `${path} 坐标非法` }); return null }
      const cx = clampX(x), cy = clampY(y)
      if (cx !== x || cy !== y) issues.push({ level: 'warn', msg: `${path} 超出画布，已夹取`, fixed: true })
      return { x: cx, y: cy }
    }

    const steps = []
    let dropped = 0
    payload.steps.slice(0, 14).forEach((rs, si) => {
      if (!rec(rs)) { dropped++; return }
      const sid = uid(str(rs.id), `s${si + 1}`)
      const prims = []
      const list = Array.isArray(rs.primitives) ? rs.primitives : []
      list.slice(0, 20).forEach((rp, pi) => {
        if (!rec(rp)) return
        const kind = str(rp.kind)
        const id = uid(str(rp.id), `${sid}-e${pi + 1}`)
        const lt = LINE_ALIAS[(str(rp.lineType) || 'thick').toLowerCase()] || LINE_ALIAS[str(rp.lineType)] || 'thick'
        if (kind === 'line') {
          const x1 = num(rp.x1), y1 = num(rp.y1), x2 = num(rp.x2), y2 = num(rp.y2)
          if ([x1, y1, x2, y2].some(v => v === null)) { issues.push({ level: 'warn', msg: `第${si + 1}步 直线端点非法，已丢弃` }); return }
          if (Math.hypot(x2 - x1, y2 - y1) < 2) { issues.push({ level: 'warn', msg: `第${si + 1}步 零长度直线，已丢弃` }); return }
          prims.push({ id, kind, lineType: lt, x1: clampX(x1), y1: clampY(y1), x2: clampX(x2), y2: clampY(y2) })
        } else if (kind === 'circle') {
          const cx = num(rp.cx), cy = num(rp.cy), r = num(rp.r)
          if (cx === null || cy === null || r === null || r <= 0) { issues.push({ level: 'warn', msg: `第${si + 1}步 圆参数非法，已丢弃` }); return }
          prims.push({ id, kind, lineType: lt, cx: clampX(cx), cy: clampY(cy), r: Math.min(r, W) })
        } else if (kind === 'arc') {
          const cx = num(rp.cx), cy = num(rp.cy), r = num(rp.r)
          let a0 = num(rp.startAngle), a1 = num(rp.endAngle)
          if (cx === null || cy === null || r === null || r <= 0) { issues.push({ level: 'warn', msg: `第${si + 1}步 圆弧参数非法，已丢弃` }); return }
          if (a0 === null) a0 = 0
          if (a1 === null) a1 = a0 + 180
          if (Math.abs(a1 - a0) < 0.5) { issues.push({ level: 'warn', msg: `第${si + 1}步 圆弧起止角相同，已丢弃` }); return }
          prims.push({ id, kind, lineType: lt, cx: clampX(cx), cy: clampY(cy), r: Math.min(r, W), startAngle: a0, endAngle: a1 })
        } else if (kind === 'dimension') {
          const from = clampPt(rp.from, `第${si + 1}步 尺寸起点`)
          const to = clampPt(rp.to, `第${si + 1}步 尺寸终点`)
          if (!from || !to) return
          if (Math.hypot(to.x - from.x, to.y - from.y) < 3) { issues.push({ level: 'warn', msg: `第${si + 1}步 尺寸两点重合，已丢弃` }); return }
          const ori = ['aligned', 'horizontal', 'vertical'].includes(str(rp.orientation)) ? str(rp.orientation) : 'aligned'
          let text = str(rp.text)
          if (!text) {
            const v = ori === 'horizontal' ? Math.abs(to.x - from.x) : ori === 'vertical' ? Math.abs(to.y - from.y) : Math.hypot(to.x - from.x, to.y - from.y)
            text = String(Math.round(v * 10) / 10)
            issues.push({ level: 'info', msg: `第${si + 1}步 尺寸缺文字，已按测量值补全`, fixed: true })
          }
          prims.push({ id, kind, from, to, offset: num(rp.offset) ?? 16, orientation: ori, text, arrow: str(rp.arrow) || 'both' })
        } else if (kind === 'text' || kind === 'label') {
          const p = clampPt(rp, `第${si + 1}步 文字`)
          const s = str(rp.text) || str(rp.s)
          if (!p || !s) { issues.push({ level: 'warn', msg: `第${si + 1}步 文字内容为空，已丢弃` }); return }
          prims.push({ id, kind: 'text', p, text: s, size: num(rp.size) || 18, anchor: str(rp.anchor) || 'start', color: str(rp.color) })
        } else if (kind === 'point') {
          const p = clampPt(rp, `第${si + 1}步 点`)
          if (!p) return
          prims.push({ id, kind: 'point', p, color: str(rp.color) })
        } else {
          issues.push({ level: 'warn', msg: `第${si + 1}步 未知图元「${kind || 'undefined'}」，已跳过` })
        }
      })
      if (!prims.length) { dropped++; issues.push({ level: 'warn', msg: `第${si + 1}步无有效图元，已跳过` }); return }
      const title = str(rs.title) || `第 ${si + 1} 步`
      const narration = str(rs.narration) || str(rs.desc) || ''
      if (!narration) issues.push({ level: 'info', msg: `第${si + 1}步缺少讲解` })
      steps.push({ id: sid, title, narration, primitives: prims })
    })

    if (!steps.length) return { doc: null, issues: issues.concat([{ level: 'error', msg: '没有任何可渲染的步骤' }]) }

    const confidence = num(metaRaw.confidence)
    const warnings = (Array.isArray(payload.warnings) ? payload.warnings : []).map(str).filter(Boolean).slice(0, 8)
    const doc = {
      version: '1.0',
      meta: {
        title: str(metaRaw.title) || '未命名图纸',
        width: W, height: H,
        summary: str(metaRaw.summary) || '',
        standard: str(metaRaw.standard) || 'GB/T 4457.4',
        unit: 'mm',
        confidence: confidence === null ? null : Math.max(0, Math.min(1, confidence)),
      },
      warnings, steps,
    }
    if (dropped) issues.push({ level: 'info', msg: `共跳过 ${dropped} 个无效步骤` })
    return { doc, issues }
  }

  /* ---------- 转成渲染场景（Paper 坐标，y 向上） ---------- */
  function toScene(doc) {
    const H = doc.meta.height
    const K = doc.meta.width / 200
    const Y = y => H - y
    const P = ([x, y]) => [x, Y(y)]
    const steps = doc.steps.map(s => {
      const els = []
      s.primitives.forEach(p => {
        if (p.kind === 'line') {
          els.push(Paper.line(P([p.x1, p.y1]), P([p.x2, p.y2]), STYLE[p.lineType] || 'solid'))
        } else if (p.kind === 'circle') {
          els.push(Paper.circle(P([p.cx, p.cy]), p.r, STYLE[p.lineType] || 'solid'))
        } else if (p.kind === 'arc') {
          els.push(Paper.arc(P([p.cx, p.cy]), p.r, p.startAngle * Math.PI / 180, p.endAngle * Math.PI / 180, STYLE[p.lineType] || 'solid'))
        } else if (p.kind === 'dimension') {
          const r = Paper.dimPrim({
            from: P([p.from.x, p.from.y]), to: P([p.to.x, p.to.y]),
            offset: p.offset, orientation: p.orientation, text: p.text, arrow: p.arrow,
            size: 15, k: K,
          })
          els.push(...r.els)
        } else if (p.kind === 'text') {
          els.push(Paper.text(P([p.p.x, p.p.y]), p.text, {
            size: p.size, anchor: p.anchor, color: p.color || '#1a1f24', noAnim: false,
          }))
        } else if (p.kind === 'point') {
          els.push(Paper.dot(P([p.p.x, p.p.y]), { r: 2.6, color: p.color || '#c0392b', noAnim: false }))
        }
      })
      return { title: s.title, desc: s.narration, els }
    })
    return {
      title: doc.meta.title,
      summary: doc.meta.summary,
      confidence: doc.meta.confidence,
      warnings: doc.warnings || [],
      standard: doc.meta.standard,
      unit: doc.meta.unit,
      sheet: { w: doc.meta.width, h: doc.meta.height, frame: true, titleBlock: true },
      steps,
      mode: 'doc',
    }
  }

  /* 内置题库产物（Paper 元素）→ 同一套场景结构
   * 图幅只用两种标准比例（横版/竖版），按图形形态选择：
   * 横向图形用横版，竖向图形用竖版。同类题切换时纸张尺寸稳定，
   * 又不会把竖长的吊钩硬塞进横纸里。
   * 排布时必须扣掉 render.js 的页边距与标题栏，否则内容会压到标题栏上。
   */
  const SHEET_LAND = 920 / 660                 // 横版 ≈ 1.394
  const SHEET_PORT = 660 / 920                 // 竖版 ≈ 0.717
  const PAD_FRAC = 0.028                       // 与 render.js 的 pad 同源
  const TB_FRAC = 0.13                         // 与 render.js 的 tbH 同源
  const MARGIN = 11                            // 图形与图框的最小间隙

  /* 与 render.js 保持一致的页边距 / 标题栏高度 */
  const frameMetrics = (w, h) => {
    const pad = Math.min(w, h) * PAD_FRAC
    const tbH = Math.min(h * TB_FRAC, h - pad * 2 - 10)
    return { pad, tbH }
  }

  function fromDraw(draw) {
    const all = draw.steps.reduce((a, s) => a.concat(s.els), [])
    const bb = Paper.bbox(all)
    const bw = Math.max(bb.w, 1), bh = Math.max(bb.h, 1)
    const ratio = (bw / bh) >= 0.95 ? SHEET_LAND : SHEET_PORT

    // 由约束反解最小 h：宽向 w-2pad ≥ bw+2M；高向 h-2pad-tbH ≥ bh+2M
    const c = PAD_FRAC * Math.min(ratio, 1)
    const byWidth = (bw + 2 * MARGIN) / (ratio - 2 * c)
    const byHeight = (bh + 2 * MARGIN) / (1 - TB_FRAC - 2 * c)
    let h = Math.max(byWidth, byHeight, 60)
    let w = h * ratio
    // pad/tbH 依赖最终尺寸，迭代两轮收敛
    for (let i = 0; i < 3; i++) {
      const { pad, tbH } = frameMetrics(w, h)
      h = Math.max((bw + 2 * MARGIN + 2 * pad) / ratio, bh + 2 * MARGIN + 2 * pad + tbH)
      w = h * ratio
    }

    // 在"图框内、标题栏以上"的可用区居中。
    // 注意坐标系翻转：SVG 里标题栏在图框底部（y 向下），
    // 换到 paper 坐标（y 向上）后它占的是"下方的小 y"，所以可用区从 pad+tbH 起。
    const { pad, tbH } = frameMetrics(w, h)
    const availW = w - 2 * pad
    const y0 = pad + tbH, y1 = h - pad
    const dx = pad + availW / 2 - (bb.x0 + bb.x1) / 2
    const dy = (y0 + y1) / 2 - (bb.y0 + bb.y1) / 2

    const title = draw.title.length > 12 ? draw.title.slice(0, 12) + '…' : draw.title
    return {
      title,
      titleFull: draw.title,
      steps: draw.steps.map(s => ({ title: s.title, desc: s.desc, els: Paper.translate(s.els, dx, dy) })),
      sheet: { w, h, frame: true, titleBlock: true },
      standard: 'GB/T 4457.4', unit: 'mm',
      warnings: [], confidence: null, summary: '', mode: 'template',
    }
  }

  return { CANVAS, parseLoose, normalize, toScene, fromDraw }
})()

  // ===== js/render.js =====
/* SvgRender — 图纸渲染器
 * 输入 scene = {sheet:{w,h}, steps:[{title,desc,els}], title, ...}
 * 输出内联 SVG：图框、标题栏、国标线型、按步生长的动画
 */
class SvgRender {
  constructor(host) {
    this.host = host
    this.step = 0
    this.scene = null
  }

  setScene(scene) {
    this.scene = scene
    this.step = 0
    this.build()
  }

  showStep(i) { this.step = i; this.build() }

  build() {
    if (!this.scene) { this.host.innerHTML = ''; return }
    this.host.innerHTML = SvgRender.buildSvg(this.scene, this.step)
    this.svg = this.host.querySelector('svg')
  }

  static buildSvg(sc, stepIndex, opts = {}) {
    const { w, h } = sc.sheet
    const k = w / 200                                  // 线宽随图幅缩放
    const pad = Math.min(w, h) * 0.028
    const frame = { x: pad, y: pad, w: w - pad * 2, h: h - pad * 2 }
    const tbW = Math.min(w * 0.32, w - pad * 2 - 10)
    /* 标题栏高度必须与 DrawingDoc.fromDraw 预留的 TB_FRAC 对齐，
       否则内容会压到标题栏上。0.13 是两边共用的约定值。 */
    const tbH = Math.min(h * 0.13, h - pad * 2 - 10)
    const tb = { x: frame.x + frame.w - tbW, y: frame.y + frame.h - tbH, w: tbW, h: tbH }

    const SY = y => h - y
    const parts = []
    /* width/height 与 viewBox 同值：给出确定的固有比例，
       即使外层 CSS 把它塞进不同形状的盒子，preserveAspectRatio 也只会留白、绝不拉伸。 */
    parts.push(`<svg class="dw" viewBox="0 0 ${w} ${h}" width="${r(w)}" height="${r(h)}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(sc.title || '')}">`)
    parts.push(`<style>${SvgRender.CSS}</style>`)
    parts.push(`<defs><pattern id="grid" width="${20 * k}" height="${20 * k}" patternUnits="userSpaceOnUse"><path d="M${20 * k} 0H0V${20 * k}" fill="none" stroke="#eef2f7" stroke-width="${Math.max(0.6, k * 0.4)}"/></pattern></defs>`)
    parts.push(`<rect width="${w}" height="${h}" fill="#fff"/>`)
    parts.push(`<rect x="${frame.x}" y="${frame.y}" width="${frame.w}" height="${frame.h}" fill="url(#grid)"/>`)
    parts.push(`<rect x="${frame.x}" y="${frame.y}" width="${frame.w}" height="${frame.h}" fill="none" stroke="#121820" stroke-width="${Math.max(1, k * 0.55)}"/>`)

    // 逐步铺开
    sc.steps.forEach((st, si) => {
      if (si > stepIndex) return
      parts.push(SvgRender.renderStep(st, si, si === stepIndex && opts.animate !== false, h, k))
    })

    // 标题栏
    if (sc.sheet.titleBlock) {
      const titleStr = sc.title || '未命名图纸'
      const cjk = /[\u4e00-\u9fa5]/g
      const textW = (str, fs) => (String(str).match(cjk) || []).length * fs + (String(str).replace(cjk, '').length * 0.55 * fs)
      const fs1 = Math.max(2.0 * k, Math.min(tbH * 0.34, (tbW - 14) / Math.max(1, textW(titleStr, 1))))
      const fs2 = Math.max(1.7 * k, Math.min(tbH * 0.18, (tbW * 0.36) / 9))
      parts.push(`<g font-family="'Segoe UI','Microsoft YaHei',sans-serif">
        <rect x="${tb.x}" y="${tb.y}" width="${tb.w}" height="${tb.h}" fill="#fff" stroke="#121820" stroke-width="${Math.max(1, k * 0.5)}"/>
        <line x1="${tb.x}" y1="${tb.y + tbH * 0.48}" x2="${tb.x + tb.w}" y2="${tb.y + tbH * 0.48}" stroke="#121820" stroke-width="${Math.max(0.8, k * 0.35)}"/>
        <text x="${tb.x + 7}" y="${tb.y + tbH * 0.31}" font-size="${r(fs1)}" font-weight="600" fill="#121820">${esc(titleStr)}</text>
        <text x="${tb.x + 7}" y="${tb.y + tbH * 0.78}" font-size="${r(fs2)}" fill="#5a6a80">${esc(sc.standard || 'GB/T 4457.4 — 线型')}</text>
        <text x="${tb.x + tb.w - 7}" y="${tb.y + tbH * 0.78}" font-size="${r(fs2)}" fill="#5a6a80" text-anchor="end">单位 ${esc(sc.unit || 'mm')}</text>
      </g>`)
    }
    parts.push('</svg>')
    return parts.join('')
  }

  static renderStep(st, si, animate, h, k) {
    const SY = y => h - y
    const groups = { solid: [], hidden: [], center: [], thin: [], dim: [] }
    const extras = []
    let textIdx = 0

    st.els.forEach((el, ei) => {
      const key = el.st === 'hidden' ? 'hidden' : el.st === 'center' ? 'center' : el.st === 'thin' ? 'thin' : el.st === 'dim' ? 'dim' : 'solid'
      if (el.t === 'line') {
        groups[key].push(`M${r(el.a[0])} ${r(SY(el.a[1]))}L${r(el.b[0])} ${r(SY(el.b[1]))}`)
      } else if (el.t === 'poly') {
        if (!el.pts || el.pts.length < 2) return
        let d = `M${r(el.pts[0][0])} ${r(SY(el.pts[0][1]))}`
        for (let i = 1; i < el.pts.length; i++) d += `L${r(el.pts[i][0])} ${r(SY(el.pts[i][1]))}`
        if (el.closed) d += 'Z'
        if (el.fill) extras.push({ kind: 'fill', d, color: el.color || '#121820', ei })
        else groups[key].push(d)
      } else if (el.t === 'circle') {
        const cx = el.c[0], cy = SY(el.c[1]), rr = el.r
        groups[key].push(`M${r(cx - rr)} ${r(cy)}A${r(rr)} ${r(rr)} 0 1 0 ${r(cx + rr)} ${r(cy)}A${r(rr)} ${r(rr)} 0 1 0 ${r(cx - rr)} ${r(cy)}`)
      } else if (el.t === 'arc') {
        let a0 = el.a0, a1 = el.a1
        while (a1 < a0) a1 += Math.PI * 2
        const large = (a1 - a0) > Math.PI ? 1 : 0
        const p0 = [el.c[0] + el.r * Math.cos(a0), SY(el.c[1] + el.r * Math.sin(a0))]
        const p1 = [el.c[0] + el.r * Math.cos(a1), SY(el.c[1] + el.r * Math.sin(a1))]
        groups[key].push(`M${r(p0[0])} ${r(p0[1])}A${r(el.r)} ${r(el.r)} 0 ${large} 0 ${r(p1[0])} ${r(p1[1])}`)
      } else if (el.t === 'dot') {
        extras.push({ kind: 'dot', cx: el.p[0], cy: SY(el.p[1]), r: Math.max(1.4, el.r * (k / 3)), color: el.color || '#c0392b', hollow: el.hollow, ei })
      } else if (el.t === 'arrow') {
        const tip = [el.tip[0], SY(el.tip[1])], from = [el.from[0], SY(el.from[1])]
        const dx = tip[0] - from[0], dy = tip[1] - from[1], L = Math.hypot(dx, dy) || 1
        const ux = dx / L, uy = dy / L
        const len = Math.min(L, 2.8 * k), wid = 1.0 * k
        extras.push({
          kind: 'fill', ei,
          d: `M${r(tip[0])} ${r(tip[1])}L${r(tip[0] - ux * len - uy * wid)} ${r(tip[1] - uy * len + ux * wid)}L${r(tip[0] - ux * len + uy * wid)} ${r(tip[1] - uy * len - ux * wid)}Z`,
          color: el.color || '#121820',
        })
      } else if (el.t === 'text') {
        const x = el.p[0], y = SY(el.p[1])
        const anchor = el.anchor === 'start' ? 'start' : el.anchor === 'end' ? 'end' : 'middle'
        const rot = el.rot ? ` transform="rotate(${(-el.rot * 180 / Math.PI).toFixed(2)} ${r(x)} ${r(y)})"` : ''
        const fs = el.size || 3
        const weight = el.weight || 400
        extras.push({
          kind: 'text', ei, delay: textIdx++,
          html: `<text x="${r(x)}" y="${r(y)}" font-size="${r(fs)}" fill="${el.color || '#121820'}" text-anchor="${anchor}" dominant-baseline="middle" font-weight="${weight}"${rot}${el.italic ? ' font-style="italic"' : ''}>${esc(el.s)}</text>`,
        })
      }
    })

    const sw = { solid: 0.62 * k, hidden: 0.32 * k, center: 0.2 * k, thin: 0.18 * k, dim: 0.18 * k }
    const dash = {
      solid: '', hidden: `${3 * k} ${1.6 * k}`, center: `${10 * k} ${1.5 * k} ${1.4 * k} ${1.5 * k}`, thin: '', dim: '',
    }

    const out = [`<g data-step="${si}" class="step">`]
    /* 尺寸标注不是"画"出来的轮廓，而是标注，让它几乎立刻出现：
       否则最后一步的尺寸要等前面几组线型依次生长完才看得见，很像"没画出来"。 */
    const order = ['solid', 'hidden', 'thin', 'center', 'dim']
    let gi = 0
    order.forEach(key => {
      const d = groups[key].join('')
      if (!d) return
      const id = `mk-${si}-${key}`
      const delay = key === 'dim' ? 0 : (animate ? gi * 70 : 0)
      if (key !== 'dim') gi++
      if (animate) {
        out.push(`<mask id="${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
          <path d="${d}" fill="none" stroke="#fff" stroke-width="${sw[key] * 6 + 1}" stroke-linecap="round" class="rv" pathLength="1" style="animation-delay:${delay}ms"${key === 'dim' ? ' data-dim="1"' : ''}/>
        </mask>`)
      }
      out.push(`<path d="${d}" fill="none" stroke="${key === 'dim' ? '#2f5d9e' : '#121820'}" stroke-width="${r(sw[key])}" stroke-linecap="round" stroke-linejoin="round"${dash[key] ? ` stroke-dasharray="${dash[key]}"` : ''}${animate ? ` mask="url(#${id})"` : ''}/>`)
    })

    extras.forEach((x, idx) => {
      /* 箭头/填充跟着线条走，早点出来；文字稍后淡入，但别拖太久 */
      const delay = animate ? 180 + Math.min(8, idx) * 45 : 0
      if (x.kind === 'text') {
        out.push(x.html.replace('<text ', `<text class="${animate ? 'fi' : ''}" style="animation-delay:${delay}ms" `))
      } else if (x.kind === 'dot') {
        out.push(`<circle cx="${r(x.cx)}" cy="${r(x.cy)}" r="${r(x.r)}" fill="${x.hollow ? '#fff' : x.color}" stroke="${x.color}" stroke-width="${r(1.2 * k / 3)}" class="${animate ? 'fi' : ''}" style="animation-delay:${delay}ms"/>`)
      } else {
        out.push(`<path d="${x.d}" fill="${x.color}" class="${animate ? 'fi' : ''}" style="animation-delay:${delay}ms"/>`)
      }
    })
    out.push('</g>')
    return out.join('')
  }

  /* 导出：去掉动画，保留完整图形 */
  static cleanSvg(svg) {
    const clone = svg.cloneNode(true)
    clone.querySelectorAll('.rv').forEach(el => { el.removeAttribute('class') })
    clone.querySelectorAll('.fi').forEach(el => { el.removeAttribute('class'); el.style.animation = 'none'; el.style.opacity = '1' })
    clone.querySelectorAll('mask').forEach(m => {
      const id = m.id
      clone.querySelectorAll(`[mask="url(#${id})"]`).forEach(el => el.removeAttribute('mask'))
      m.remove()
    })
    return clone
  }

  async exportSvg(name) {
    if (!this.scene) return
    const full = this.fullSvg()
    download(new Blob([full], { type: 'image/svg+xml;charset=utf-8' }), `${name || 'drawing'}.svg`)
  }

  fullSvg() {
    // 先展开全部步骤再序列化
    const keep = this.step
    this.step = this.scene.steps.length - 1
    this.build()
    const svg = SvgRender.cleanSvg(this.svg)
    svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg')
    const out = new XMLSerializer().serializeToString(svg)
    this.step = keep
    this.build()
    return `<?xml version="1.0" encoding="UTF-8"?>\n${out}`
  }

  async exportPng(name, scale = 2) {
    if (!this.scene) return

    const src = this.fullSvg()
    const img = new Image()
    const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src)
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url })
    const cv = document.createElement('canvas')
    cv.width = w * scale; cv.height = h * scale
    const ctx = cv.getContext('2d')
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height)
    ctx.drawImage(img, 0, 0, cv.width, cv.height)
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'))
    download(blob, `${name || 'drawing'}.png`)
  }
